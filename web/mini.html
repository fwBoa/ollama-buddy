<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ollama Buddy — summary</title>
<link rel="icon" href="ollama.png" type="image/png">
<style>
  :root {
    color-scheme: light;
    --surface:   #fcfcfb;
    --text-1:    #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #6e6c67;
    --grid:      #e1e0d9;
    --border:    rgba(11,11,11,0.10);
    --ghost:     rgba(11,11,11,0.05);
    /* Calibres par theme, comme dans le tableau de bord : un ambre ou un
       orange clair ne tient pas sur le fond clair. */
    --good:      #006300;
    --warning:   #c57f00;
    --serious:   #bc572e;
    --critical:  #d03b3b;
    --accent:    #2271ce;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#898781;
    --ease-out:  cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface:  #1c1c1a;
      --text-1:   #ffffff;
      --text-2:   #c3c2b7;
      --text-3:   #898781;
      --grid:     #2c2c2a;
      --border:   rgba(255,255,255,0.10);
      --ghost:    rgba(255,255,255,0.06);
      --good:     #0ca30c;
      --warning:  #fab219;
      --serious:  #ec835a;
      --critical: #de4946;
      --accent:   #3987e5;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#898781;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:  #1c1c1a;
    --text-1:   #ffffff;
    --text-2:   #c3c2b7;
    --text-3:   #898781;
    --grid:     #2c2c2a;
    --border:   rgba(255,255,255,0.10);
    --ghost:    rgba(255,255,255,0.06);
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #de4946;
    --accent:   #3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#898781;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 18px 14px;
    background: var(--surface); color: var(--text-1);
    font: 13px/1.45 system-ui, -apple-system, "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased;
    width: 300px; overflow: hidden;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 5px; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .head h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .live { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600;
          text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .live.stale i { background: var(--warning); }

  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
           color: var(--text-3); margin: 0 0 7px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .big { font-size: 27px; font-weight: 600; line-height: 1; letter-spacing: -0.02em;
         font-variant-numeric: tabular-nums; }
  .sub { font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .meter { height: 8px; border-radius: 999px; overflow: hidden; margin: 9px 0 7px;
           background: color-mix(in oklab, var(--fill) 20%, var(--surface)); }
  .meter > span { display: block; height: 100%; width: 100%; border-radius: 999px;
                  background: var(--fill); transform-origin: left center; transform: scaleX(0);
                  transition: transform 280ms var(--ease-out); }

  hr { border: 0; border-top: 1px solid var(--grid); margin: 14px 0; }

  .models { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .m { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .m i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .m .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  .m .v { font-variant-numeric: tabular-nums; font-weight: 500; }

  .actions { display: flex; gap: 8px; margin-top: 15px; }
  button {
    font: inherit; font-size: 12px; font-weight: 500; flex: 1;
    color: var(--text-1); background: var(--ghost);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; min-height: 30px; cursor: pointer;
    transition: transform 120ms var(--ease-out), background 160ms var(--ease-out);
  }
  button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { button:hover { background: var(--grid); } }

  .empty { color: var(--text-3); font-size: 12px; padding: 6px 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="head">
  <h1>Ollama Buddy</h1>
  <span class="live" id="live"><i aria-hidden="true"></i><span>…</span></span>
</div>

<div id="body"><p class="empty" id="boot">Reading…</p></div>

<script>
"use strict";
/* Meme mecanique et meme raisonnement que le tableau de bord. L'apercu n'a
   pas de bouton de langue : le reglage se fait dans le tableau de bord, et il
   suit ici comme le theme. */
const FR = {
  'Ollama Buddy — summary': 'Ollama Buddy — aperçu',
  'Reading…': 'Lecture…',
  'Reset on {date}': 'Réinitialisation le {date}',
  ' · reset tomorrow': ' · demain',
  ' · reset in {n} days': ' ·\u00A0dans {n} jours',
  'Monthly quota': 'Quota mensuel',
  '{pct} of the monthly quota': '{pct} du quota mensuel',
  ': {current} of {monthly}': ' : {current} sur {monthly}',
  '{current} of {monthly}': '{current} sur {monthly}',
  'Cannot read — check your API key in the dashboard.': 'Lecture impossible — vérifie ta clé API dans le tableau de bord.',
  'No figures: the quota is read from ollama.com. Open the dashboard to paste your API key.':
    'Aucun chiffre : le quota se lit sur ollama.com. Ouvre le tableau de bord pour coller ta clé API.',
  '{amount} / day': '{amount} / jour',
  ' — cap exceeded': ' — plafond dépassé',
  ' — cap reached today': " — plafond atteint aujourd'hui",
  ' — cap reached tomorrow': ' — plafond atteint demain',
  ' — cap reached in {n} days': ' — plafond atteint dans\u00A0{n} jours',
  'This cycle': 'Le cycle',
  'Last days': 'Derniers jours',
  'Other ({n})': 'Autres ({n})',
  'No usage in this cycle.': 'Aucune consommation sur ce cycle.',
  'Open the dashboard': 'Ouvrir le tableau de bord',
  'Live': 'En direct',
  'Reconnecting': 'Reconnexion',
};

let lang = 'en';
let lastSig = '';
let hasRendered = false;

const squeeze = s => s.replace(/\s+/g, ' ').trim();
const FR_BY_KEY = new Map(Object.entries(FR).map(([k, v]) => [squeeze(k), v]));
const fill = (text, values) =>
  text.replace(/\{(\w+)\}/g, (m, k) => (k in values ? values[k] : m));
const T = s => (lang === 'fr' ? (FR_BY_KEY.get(squeeze(s)) ?? s) : s);
const locale = () => (lang === 'fr' ? 'fr-FR' : 'en-US');

function resolveLang(pref) {
  if (pref === 'fr' || pref === 'en') return pref;
  return String(navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
}

const exact = n => new Intl.NumberFormat(locale()).format(n);
const usd = n => (lang === 'fr' ? n.toFixed(2).replace('.', ',') + ' $' : '$' + n.toFixed(2));
const pct = x => (lang === 'fr'
  ? (x * 100).toFixed(1).replace('.', ',') + ' %'
  : (x * 100).toFixed(1) + '%');
const severity = r => r >= 0.9 ? 'var(--critical)' : r >= 0.7 ? 'var(--serious)' : 'var(--accent)';
/* Les jours arrivent en ISO, coupes en UTC ; le libelle appartient au client. */
const compact = n => {
  const fr = lang === 'fr';
  const num = (v, d) => (fr ? v.toFixed(d).replace('.', ',') : v.toFixed(d));
  const unit = u => (fr ? ' ' : '') + u;
  if (n >= 1e6) return num(n / 1e6, 2) + unit('M');
  if (n >= 1e3) return num(n / 1e3, 1) + unit('k');
  return String(n);
};
const modelLabel = m => (m.other ? fill(T('Other ({n})'), { n: m.other_count ?? '?' }) : m.model);

const dayLabel = iso => new Date(iso + 'T00:00:00Z')
  .toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short' });

/* Combien de jours pleins il reste, comme ollama.com les compte. Le libelle
   porte aussi la date : « dans 5 jours » et « dans 6 jours » decrivent la
   meme remise a zero selon qu'on compte les jours pleins ou ceux du
   calendrier, et c'est la date qui tranche. */
function resetLabel(q) {
  if (!q.resets_at || q.days_left === null || q.days_left === undefined) return '';
  const quand = new Date(q.resets_at)
    .toLocaleDateString(locale(), { day: 'numeric', month: 'short' });
  const jours = Math.floor(q.days_left);
  return fill(T('Reset on {date}'), { date: quand })
    + (jours === 0 ? ''
      : jours === 1 ? T(' · reset tomorrow')
      : fill(T(' · reset in {n} days'), { n: jours }));
}

function render(d) {
  const q = d.quota || {};
  const body = document.getElementById('body');

  if (d.theme) applyTheme(d.theme);
  if (d.lang) applyLang(d.lang);

  /* Le quota ne vient que d'ollama.com. Sans cle, on n'affiche aucun chiffre
     plutot qu'un montant saisi a la main — il pouvait dater de semaines.
     Le compte a rebours, lui, se tait quand la date n'est pas connue : les
     reglages, ou une remise a zero deja vue, sont les seules sources. */
  const resetLine = resetLabel(q);

  let quotaBlock = '';
  if (q.source === 'api' && typeof q.ratio === 'number') {
    const ratio = q.ratio;
    const has = q.current !== null && q.current !== undefined;
    quotaBlock = `
      <div class="row">
        <span class="label" style="margin:0">${T('Monthly quota')}</span>
        <span class="sub" style="font-weight:600;color:var(--text-1)">${pct(ratio)}</span>
      </div>
      <div class="meter" style="--fill:${severity(ratio)}" role="img"
           aria-label="${T('{pct} of the monthly quota').replace('{pct}', pct(ratio))}${
             has ? fill(T(': {current} of {monthly}'), { current: usd(q.current), monthly: usd(q.monthly) }) : ''}">
        <span style="transform:scaleX(${Math.min(ratio, 1).toFixed(4)})"></span>
      </div>
      <div class="row">
        <span class="sub">${has ? fill(T('{current} of {monthly}'), { current: usd(q.current), monthly: usd(q.monthly) }) : ''}</span>
        <span class="sub">${resetLine}</span>
      </div>`;
  } else {
    /* Rien d'autre ici : sans cle, ollama.com ne repond rien, et l'app n'a
       donc aucun chiffre de quota a montrer — juste l'invitation a en saisir
       une depuis le tableau de bord. */
    quotaBlock = `<p class="label">${T('Monthly quota')}</p>
      <p class="sub">${q.key_set
        ? T('Cannot read — check your API key in the dashboard.')
        : T('No figures: the quota is read from ollama.com. Open the dashboard to paste your API key.')}</p>`;
  }

  /* Les trois premiers modeles, puis les trois derniers jours. La repartition
     par modele ne bouge plus : le 07/10/2026 l'API a cesse de la publier. */
  const modeles = (d.models || []).slice(0, 3).map(m =>
    `<div class="m"><i style="background:var(--s${m.slot + 1}, var(--text-3))"></i>
       <span class="n">${modelLabel(m)}</span><span class="v">${compact(m.total)}</span></div>`
  ).join('');
  const jours = (d.days || []).slice(-3).reverse().map(j =>
    `<div class="m"><span class="n">${dayLabel(j.day)}</span><span class="v">${usd(j.usd)}</span></div>`
  ).join('');

  /* Jours pleins, pluriel compris : « dans 1 jours » se lisait mal. */
  const joursAvant = n => (n === 0 ? T(' — cap reached today')
    : n === 1 ? T(' — cap reached tomorrow')
    : fill(T(' — cap reached in {n} days'), { n }));

  const rate = q.rate_per_day && q.exhausted_in_days !== null && q.exhausted_in_days !== undefined
    ? `<p class="sub" style="margin:10px 0 0">${fill(T('{amount} / day'), { amount: usd(q.rate_per_day) })}${
        q.ratio >= 1 ? T(' — cap exceeded')
          : q.days_left !== null && q.exhausted_in_days < q.days_left
            ? joursAvant(Math.floor(q.exhausted_in_days)) : ''}</p>`
    : '';

  /* Sans cle, il n'y a aucune source : l'apercu se reduit au quota, qui porte
     alors l'invitation a en saisir une. */
  const live = q.source === 'api';

  body.innerHTML = `
    ${quotaBlock}
    ${rate}
    ${live ? `
      <hr>
      <p class="label">${T('This cycle')}</p>
      <div class="row">
        <span class="big">${usd(d.usd || 0)}</span>
        <span class="sub">${exact(d.requests || 0)} req.</span>
      </div>
      <div class="models">${modeles || jours || `<p class="empty">${T('No usage in this cycle.')}</p>`}</div>
      <p class="label" style="margin-top:12px">${T('Last days')}</p>
      <div class="models">${jours || `<p class="empty">${T('No usage in this cycle.')}</p>`}</div>` : ''}
    <div class="actions">
      <button type="button" id="open">${T('Open the dashboard')}</button>
    </div>`;

  document.getElementById('open').addEventListener('click', () => {
    location.href = 'ollama-buddy://open';
  });

  // Apres innerHTML, pas avant : mesurer plus tot renvoyait la hauteur de
  // l'ancien contenu (une bande de 103 px).
  hasRendered = true;
  reportSize();
}

function setLive(on) {
  const el = document.getElementById('live');
  el.classList.toggle('stale', !on);
  el.lastElementChild.textContent = T(on ? 'Live' : 'Reconnecting');
}

/* Le popover s'ajuste a la hauteur reelle du contenu : sans cela il garde la
   taille demandee a la construction et laisse un vide en bas.
   Pas de requestAnimationFrame ici : la page est chargee avant que le popover
   soit visible, et rAF ne se declenche pas tant que la vue n'est pas affichee.
   getBoundingClientRect force le reflow, la mesure est donc deja juste. */
function reportSize() {
  // Tant que le contenu n'est pas rendu, la page ne fait que la hauteur du
  // titre : annoncer 103 px reduirait le popover a une bande minuscule.
  if (!hasRendered) return;
  const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.popoverSize;
  if (!bridge) return;
  bridge.postMessage(Math.ceil(document.body.getBoundingClientRect().height));
}

function applyTheme(value) {
  const root = document.documentElement;
  if (value === 'light' || value === 'dark') root.setAttribute('data-theme', value);
  else root.removeAttribute('data-theme');
}

/* L'apercu n'a pas de bouton de langue : il suit le reglage du tableau de
   bord. "auto" se resout ici sur la langue du systeme, comme la-bas. */
function applyLang(pref) {
  lang = resolveLang(pref);
  document.documentElement.lang = lang;
  document.title = T('Ollama Buddy — summary');
  // Le texte d'attente, avant le premier envoi du serveur. Il disparait avec
  // #body au premier rendu.
  const boot = document.getElementById('boot');
  if (boot) boot.textContent = T('Reading…');
}

new ResizeObserver(reportSize).observe(document.body);
/* Peinture immediate : navigator.language est disponible avant tout appel au
   serveur, donc le titre ne reste pas en anglais sur un Mac francais. */
applyLang('auto');
window.addEventListener('load', reportSize);

function connect() {
  const stream = new EventSource('/api/stream?range=today');
  stream.onopen = () => setLive(true);
  stream.onerror = () => setLive(false);
  stream.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    const sig = `${d.usd}|${d.requests}|${d.days?.length}|${d.quota?.current}|${d.quota?.monthly}`
      // source / key_set : sans eux, coller une cle refusee ne redessinerait rien.
      + `|${d.quota?.source}|${d.quota?.key_set}`
      // lang : un changement de langue ne bouge aucun chiffre, mais doit
      // redessiner tout le texte.
      + `|${d.lang}`;
    if (sig === lastSig) return;
    lastSig = sig;
    setLive(true);
    render(d);
  };
}

connect();
</script>
</body>
</html>
