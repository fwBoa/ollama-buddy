<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ollama Buddy — summary</title>
<link rel="icon" href="ollama.png" type="image/png">
<style>
  :root {
    color-scheme: light;
    --page:#f7f8f5; --surface:#fdfdfa; --rail:#edefe8; --text:#202a24;
    --muted:#5e6b62; --line:#dce2d9; --soft:#e8eee6; --accent:#2c6349;
    --accent-soft:#e4eee4; --on-accent:#fafcf8; --good:#2c6349;
    --serious:#975122; --critical:#b73f3f; --warning:#975122;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media(prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      color-scheme:dark;
      --page:#171e1a; --surface:#1d2620; --rail:#131a16; --text:#ecf0e8;
      --muted:#a6b3a7; --line:#364039; --soft:#2a352d; --accent:#a7cfaf;
      --accent-soft:#2a3d30; --on-accent:#18251c; --good:#a7cfaf;
      --serious:#edb478; --critical:#ff9e9a; --warning:#edb478;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --page:#171e1a; --surface:#1d2620; --rail:#131a16; --text:#ecf0e8;
    --muted:#a6b3a7; --line:#364039; --soft:#2a352d; --accent:#a7cfaf;
    --accent-soft:#2a3d30; --on-accent:#18251c; --good:#a7cfaf;
    --serious:#edb478; --critical:#ff9e9a; --warning:#edb478;
  }

  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; padding:18px; width:300px; overflow:hidden; background:var(--surface); color:var(--text); font:12px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1,p { margin:0; } button { font:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; }
  .head h1 { font-size:13px; font-weight:650; letter-spacing:-.02em; }
  .live { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
  .live i { width:5px; height:5px; border-radius:50%; background:var(--good); }
  .live.stale i { background:var(--warning); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .label { font-size:11px; color:var(--muted); }
  .quota-number { font-size:26px; letter-spacing:-.04em; font-variant-numeric:tabular-nums; font-weight:550; }
  .sub { font-size:11px; color:var(--muted); line-height:1.6; }
  .meter { background:var(--soft); height:6px; overflow:hidden; border-radius:3px; margin:10px 0; }
  .meter span { display:block; width:100%; height:100%; transform-origin:left; background:var(--fill); }
  .spending { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px 0; margin-top:16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .big { display:block; margin-top:5px; font-size:20px; font-weight:550; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .models { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .m { display:flex; justify-content:space-between; gap:10px; font-size:11px; }
  .n { color:var(--muted); } .v { font-variant-numeric:tabular-nums; }
  .actions { margin-top:18px; }
  button { width:100%; border:1px solid var(--line); background:var(--rail); color:var(--text); padding:9px 10px; border-radius:6px; font-size:12px; font-weight:550; }
  button:hover { background:var(--soft); } button:active { background:var(--accent-soft); }
  .empty { color:var(--muted); font-size:12px; line-height:1.65; margin:10px 0; }
  @media(prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div class="head">
  <h1>Ollama Buddy</h1>
  <span class="live" id="live"><i aria-hidden="true"></i><span>…</span></span>
</div>

<div id="body"><p class="empty" id="boot">Reading…</p></div>

<script>
"use strict";
/* Meme mecanique et meme raisonnement que le tableau de bord. L'apercu n'a
   pas de bouton de langue : le reglage se fait dans le tableau de bord, et il
   suit ici comme le theme. */
const FR = {
  'Today (UTC)': 'Aujourd’hui (UTC)',
  'Remaining': 'Disponible',
  'Cap not configured': 'Plafond non configuré',
  'No cycle configured': 'Aucun cycle configuré',
  'History incomplete': 'Historique incomplet',
  'Quota unavailable': 'Quota indisponible',
  'Connect your account': 'Connecte ton compte',
  'Estimated monthly quota': 'Quota mensuel estimé',

  'Ollama Buddy — summary': 'Ollama Buddy — aperçu',
  'Reading…': 'Lecture…',
  'Reset on {date} (UTC)': 'Réinitialisation le {date} (UTC)',
  ' · reset tomorrow': ' · demain',
  ' · reset in {n} days': ' ·\u00A0dans {n} jours',
  'Monthly quota': 'Quota mensuel estimé',
  'Estimated monthly quota': 'Quota mensuel estimé',
  'Available spending': 'Dépense disponible',
  'Models · read on {date}': 'Modèles · relevé du {date}',
  '{pct} of the monthly quota': '{pct} du quota mensuel',
  ': {current} of {monthly}': ' : {current} sur {monthly}',
  '{current} of {monthly}': '{current} sur {monthly}',
  'Cannot read — check your API key in the dashboard.': 'Lecture impossible — vérifie ta clé API dans le tableau de bord.',
  'Open Settings to enter the reset date and monthly cap.': 'Ouvre les paramètres pour renseigner la date de réinitialisation et le plafond mensuel.',
  'Incomplete cycle history — open the dashboard for details.': 'Historique du cycle incomplet — ouvre le tableau de bord pour les détails.',
  'No figures: the quota is read from ollama.com. Open the dashboard to paste your API key.':
    'Aucun chiffre : le quota se lit sur ollama.com. Ouvre le tableau de bord pour coller ta clé API.',
  '{amount} / day': '{amount} / jour',
  ' — cap exceeded': ' — plafond dépassé',
  ' — cap reached today': " — plafond atteint aujourd'hui",
  ' — cap reached tomorrow': ' — plafond atteint demain',
  ' — cap reached in {n} days': ' — plafond atteint dans\u00A0{n} jours',
  'This cycle': 'Le cycle',
  'Last days': 'Derniers jours',
  'Other ({n})': 'Autres ({n})',
  'No usage in this cycle.': 'Aucune consommation sur ce cycle.',
  'Open the dashboard': 'Ouvrir le tableau de bord',
  'Live': 'En direct',
  'Reconnecting': 'Reconnexion',
};

let lang = 'en';
let lastSig = '';
let hasRendered = false;

const squeeze = s => s.replace(/\s+/g, ' ').trim();
const FR_BY_KEY = new Map(Object.entries(FR).map(([k, v]) => [squeeze(k), v]));
const fill = (text, values) =>
  text.replace(/\{(\w+)\}/g, (m, k) => (k in values ? values[k] : m));
const T = s => (lang === 'fr' ? (FR_BY_KEY.get(squeeze(s)) ?? s) : s);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const locale = () => (lang === 'fr' ? 'fr-FR' : 'en-US');

function resolveLang(pref) {
  if (pref === 'fr' || pref === 'en') return pref;
  return String(navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
}

const exact = n => new Intl.NumberFormat(locale()).format(n);
const usd = n => (lang === 'fr' ? n.toFixed(2).replace('.', ',') + ' $' : '$' + n.toFixed(2));
const pct = x => (lang === 'fr'
  ? (x * 100).toFixed(1).replace('.', ',') + ' %'
  : (x * 100).toFixed(1) + '%');
const severity = r => r >= 0.9 ? 'var(--critical)' : r >= 0.7 ? 'var(--serious)' : 'var(--accent)';
/* Les jours arrivent en ISO, coupes en UTC ; le libelle appartient au client. */
const compact = n => {
  const fr = lang === 'fr';
  const num = (v, d) => (fr ? v.toFixed(d).replace('.', ',') : v.toFixed(d));
  const unit = u => (fr ? ' ' : '') + u;
  if (n >= 1e6) return num(n / 1e6, 2) + unit('M');
  if (n >= 1e3) return num(n / 1e3, 1) + unit('k');
  return String(n);
};
const modelLabel = m => (m.other ? fill(T('Other ({n})'), { n: m.other_count ?? '?' }) : m.model);

const dayLabel = iso => new Date(iso + 'T00:00:00Z')
  .toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });

/* Combien de jours pleins il reste, comme ollama.com les compte. Le libelle
   porte aussi la date : « dans 5 jours » et « dans 6 jours » decrivent la
   meme remise a zero selon qu'on compte les jours pleins ou ceux du
   calendrier, et c'est la date qui tranche. */
function resetLabel(q) {
  if (!q.resets_at || q.days_left === null || q.days_left === undefined) return '';
  const quand = new Date(q.resets_at)
    .toLocaleDateString(locale(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle:'h23', timeZone: 'UTC' });
  const jours = Math.floor(q.days_left);
  return fill(T('Reset on {date} (UTC)'), { date: quand })
    + (jours === 0 ? ''
      : jours === 1 ? T(' · reset tomorrow')
      : fill(T(' · reset in {n} days'), { n: jours }));
}

function render(d) {
  const q = d.quota || {};
  if (d.theme) applyTheme(d.theme);
  if (d.lang) applyLang(d.lang);
  const ready = q.source === 'api' && typeof q.ratio === 'number';
  const days = d.days || [];
  const today = days.find(day=>day.day === new Date().toISOString().slice(0,10));
  const quotaBlock = ready ? `
    <p class="label">${T('Estimated monthly quota')}</p>
    <div class="row"><span class="quota-number">${pct(q.ratio)}</span><span class="sub">${T('Remaining')} ${usd(Math.max(0,q.monthly-(q.current || 0)))}</span></div>
    <div class="meter" role="img" style="--fill:${severity(q.ratio)}" aria-label="${fill(T('{pct} of the monthly quota'),{pct:pct(q.ratio)})}"><span style="transform:scaleX(${Math.max(0,Math.min(q.ratio,1)).toFixed(4)})"></span></div>
    <p class="sub">${resetLabel(q)}</p>` : `
    <p class="label">${T('Estimated monthly quota')}</p><p class="empty">${q.key_set
      ? q.error === 'incomplete history' ? T('History incomplete') : q.key_error || q.key_storage_error ? T('Quota unavailable') : !q.monthly ? T('Cap not configured') : T('No cycle configured')
      : T('Connect your account')}</p><p class="sub">${q.key_set
        ? q.error === 'incomplete history' ? T('Incomplete cycle history — open the dashboard for details.')
          : !q.key_error && (q.cycle_known === false || !q.monthly) ? T('Open Settings to enter the reset date and monthly cap.') : T('Cannot read — check your API key in the dashboard.')
        : T('No figures: the quota is read from ollama.com. Open the dashboard to paste your API key.')}</p>`;
  document.getElementById('body').innerHTML = `${quotaBlock}
    ${d.usage_available ? `<div class="spending"><div><p class="label">${d.period === 'cycle' ? T('This cycle') : T('Available spending')}</p><span class="big">${usd(d.usd || 0)}</span></div><div><p class="label">${T('Today (UTC)')}</p><span class="big">${today ? usd(today.usd) : '…'}</span></div></div>
      <div class="models">${days.slice(-3).reverse().map(day=>`<div class="m"><span class="n">${dayLabel(day.day)}</span><span class="v">${usd(day.usd)}</span></div>`).join('')}</div>` : ''}
    <div class="actions"><button type="button" id="open">${T('Open the dashboard')} ↗</button></div>`;
  document.getElementById('open').addEventListener('click',()=>{ location.href='ollama-buddy://open'; });
  hasRendered = true;
  reportSize();
}

function setLive(on) {
  const el = document.getElementById('live');
  el.classList.toggle('stale', !on);
  el.lastElementChild.textContent = T(on ? 'Live' : 'Reconnecting');
}

/* Le popover s'ajuste a la hauteur reelle du contenu : sans cela il garde la
   taille demandee a la construction et laisse un vide en bas.
   Pas de requestAnimationFrame ici : la page est chargee avant que le popover
   soit visible, et rAF ne se declenche pas tant que la vue n'est pas affichee.
   getBoundingClientRect force le reflow, la mesure est donc deja juste. */
function reportSize() {
  // Tant que le contenu n'est pas rendu, la page ne fait que la hauteur du
  // titre : annoncer 103 px reduirait le popover a une bande minuscule.
  if (!hasRendered) return;
  const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.popoverSize;
  if (!bridge) return;
  bridge.postMessage(Math.ceil(document.body.getBoundingClientRect().height));
}

function applyTheme(value) {
  const root = document.documentElement;
  if (value === 'light' || value === 'dark') root.setAttribute('data-theme', value);
  else root.removeAttribute('data-theme');
}

/* L'apercu n'a pas de bouton de langue : il suit le reglage du tableau de
   bord. "auto" se resout ici sur la langue du systeme, comme la-bas. */
function applyLang(pref) {
  lang = resolveLang(pref);
  document.documentElement.lang = lang;
  document.title = T('Ollama Buddy — summary');
  // Le texte d'attente, avant le premier envoi du serveur. Il disparait avec
  // #body au premier rendu.
  const boot = document.getElementById('boot');
  if (boot) boot.textContent = T('Reading…');
}

new ResizeObserver(reportSize).observe(document.body);
/* Peinture immediate : navigator.language est disponible avant tout appel au
   serveur, donc le titre ne reste pas en anglais sur un Mac francais. */
applyLang('auto');
window.addEventListener('load', reportSize);

function connect() {
  const stream = new EventSource('/api/stream?range=today');
  stream.onopen = () => setLive(true);
  stream.onerror = () => setLive(false);
  stream.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    const sig = JSON.stringify({
      usd: d.usd, requests: d.requests, days: d.days, usage_available: d.usage_available,
      period: d.period, theme: d.theme, lang: d.lang,
      quota: { ...d.quota, days_left: Math.floor(d.quota?.days_left ?? -1) },
    });
    if (sig === lastSig) return;
    lastSig = sig;
    setLive(true);
    render(d);
  };
}

connect();
</script>
</body>
</html>
