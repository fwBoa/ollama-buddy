<style>
  :root {
    color-scheme: light;
    --page:#f7f8f5; --surface:#fdfdfa; --rail:#edefe8; --text:#202a24;
    --muted:#5e6b62; --line:#dce2d9; --soft:#e8eee6; --accent:#2c6349;
    --accent-soft:#e4eee4; --on-accent:#fafcf8; --good:#2c6349;
    --serious:#975122; --critical:#b73f3f; --warning:#975122;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media(prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      color-scheme:dark;
      --page:#171e1a; --surface:#1d2620; --rail:#131a16; --text:#ecf0e8;
      --muted:#a6b3a7; --line:#364039; --soft:#2a352d; --accent:#a7cfaf;
      --accent-soft:#2a3d30; --on-accent:#18251c; --good:#a7cfaf;
      --serious:#edb478; --critical:#ff9e9a; --warning:#edb478;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --page:#171e1a; --surface:#1d2620; --rail:#131a16; --text:#ecf0e8;
    --muted:#a6b3a7; --line:#364039; --soft:#2a352d; --accent:#a7cfaf;
    --accent-soft:#2a3d30; --on-accent:#18251c; --good:#a7cfaf;
    --serious:#edb478; --critical:#ff9e9a; --warning:#edb478;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--page); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button,input,select { font:inherit; }
  button,a,input,select,summary { -webkit-tap-highlight-color:transparent; }
  button { cursor:pointer; }
  button:disabled { cursor:wait; opacity:.55; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
  #main:focus { outline:none; }
  a { color:var(--accent); text-underline-offset:3px; }
  h1,h2,h3,p { margin:0; }
  h1 { font-size:25px; line-height:1.25; letter-spacing:-.035em; font-weight:650; }
  h2 { font-size:16px; font-weight:650; letter-spacing:-.02em; }
  h3 { font-size:14px; font-weight:600; }
  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  .skip { position:fixed; top:-100px; left:16px; z-index:20; padding:10px 18px; background:var(--surface); }
  .skip:focus { top:12px; }
  .shell { display:grid; grid-template-columns:196px minmax(0,1fr); min-height:100vh; }
  .sidebar { padding:32px 16px 20px; position:sticky; top:0; height:100vh; background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .in-app .sidebar { padding-top:54px; }
  .brand { display:flex; align-items:center; gap:10px; padding:0 10px; font-size:14px; font-weight:650; line-height:1.25; letter-spacing:-.02em; }
  .logo { width:26px; height:35px; display:inline-block; flex-shrink:0; background:var(--text); -webkit-mask:url(ollama.png) center/contain no-repeat; mask:url(ollama.png) center/contain no-repeat; }
  .brand small { display:block; font-size:11px; color:var(--muted); margin-top:4px; font-weight:400; letter-spacing:0; }
  .nav { display:flex; flex-direction:column; gap:6px; margin-top:42px; }
  .nav button { display:flex; align-items:center; gap:10px; width:100%; border:0; padding:10px 12px; border-radius:7px; background:transparent; color:var(--muted); text-align:left; font-size:13px; font-weight:500; }
  .nav button[aria-current="page"] { background:var(--surface); color:var(--text); box-shadow:0 1px 2px #18251c08; }
  .nav button:hover { color:var(--text); background:var(--soft); }
  .icon { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .workspace { min-width:0; padding:34px 36px 24px; max-width:1450px; width:100%; margin:0 auto; }
  .in-app .workspace { padding-top:48px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:30px; }
  .eyebrow { color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
  .toolbar { display:flex; align-items:center; gap:12px; }
  .live { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); white-space:nowrap; }
  .live i { height:6px; width:6px; background:var(--good); border-radius:50%; }
  .live.stale i { background:var(--warning); }
  .icon-btn { display:grid; place-items:center; width:34px; height:34px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:7px; }
  .icon-btn:hover { background:var(--soft); }
  .icon-btn[aria-busy="true"] .icon { animation:rotate 1s linear infinite; }
  @keyframes rotate { to { transform:rotate(360deg); } }
  .sub,.hint,.caption { font-size:12px; color:var(--muted); }
  .sub { margin-bottom:22px; }
  .hint { max-width:70ch; line-height:1.6; margin-top:8px; }
  .overview-grid { display:grid; grid-template-columns:minmax(0,1fr) 268px; gap:24px; align-items:start; }
  .activity-panel { min-width:0; }
  .metrics { display:grid; grid-template-columns:1.45fr 1fr 1fr; gap:18px; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .metrics.two { grid-template-columns:1fr 1fr; }
  .fallback-settings { margin-top:18px; }
  .fallback-settings summary,.selected-tokens summary { cursor:pointer; color:var(--muted); }
  .metric .k { font-size:12px; color:var(--muted); display:block; margin-bottom:8px; }
  .metric .v { font-size:28px; font-weight:550; letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:1.2; white-space:nowrap; }
  .metric:first-child .v { color:var(--accent); }
  .section-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 18px; }
  .segmented { display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:7px; }
  .segmented button { padding:4px 9px; font-size:11px; border:0; background:transparent; color:var(--muted); border-radius:4px; white-space:nowrap; }
  .segmented button[aria-pressed="true"] { background:var(--text); color:var(--surface); }
  .chart { height:170px; position:relative; margin:0 0 10px; padding:16px 0 0; border-bottom:1px solid var(--line); }
  .chart-scale { position:absolute; top:-5px; right:0; font-size:10px; color:var(--muted); }
  .chart-day.missing::after { content:""; position:absolute; bottom:0; width:100%; height:5px; border:1px dashed var(--muted); border-bottom:0; }
  .disconnect-confirm { padding:14px; background:var(--soft); border-radius:6px; margin-top:16px; font-size:12px; }
  .chart-grid { position:absolute; inset:16px 0 0; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; }
  .chart-grid span { border-top:1px dashed var(--line); }
  .chart-bars { display:flex; align-items:stretch; height:100%; gap:5px; position:relative; }
  .chart-day { flex:1; min-width:0; border:0; padding:0 1px; background:transparent; display:flex; align-items:flex-end; position:relative; }
  .chart-day span { background:var(--accent-soft); width:100%; height:var(--height); border-radius:3px 3px 0 0; border:1px solid var(--accent); border-bottom:0; transition:background 160ms var(--ease); }
  .chart-day[aria-pressed="true"] span,.chart-day:hover span { background:var(--accent); }
  .chart-day.zero::after { content:""; width:100%; height:3px; background:var(--line); position:absolute; bottom:0; }
  .chart-day:focus-visible { outline-offset:1px; }
  .chart-axis { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; }
  .chart-detail { margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; min-height:50px; }
  .chart-detail strong { font-size:13px; font-weight:550; }
  .chart-detail .caption { margin-top:2px; }
  .chart-detail .amount { font-size:18px; font-variant-numeric:tabular-nums; }
  .quota { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .quota-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-top:20px; }
  .quota .pct { font-size:33px; font-weight:550; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .quota-tag { font-size:10px; background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:4px 7px; margin-top:8px; }
  .meter { height:7px; border-radius:4px; background:var(--soft); overflow:hidden; margin:14px 0 10px; }
  .meter span { display:block; width:100%; height:100%; background:var(--fill); transform-origin:left; }
  .quota-foot { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .quota-facts { margin:24px 0 18px; }
  .quota-facts div { display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:8px 0; border-top:1px solid var(--line); }
  .quota-facts dt { color:var(--muted); }
  .quota-facts dd { margin:0; text-align:right; }
  .quota .hint { font-size:11px; }
  .text-button { padding:0; border:0; background:transparent; color:var(--accent); font-size:12px; font-weight:550; text-decoration:underline; text-underline-offset:4px; }
  .quota .text-button { margin-top:14px; }
  details summary { cursor:pointer; font-size:12px; color:var(--muted); }
  details p { margin-top:10px; font-size:12px; color:var(--muted); line-height:1.65; }
  .projection { margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line); }
  .alert { color:var(--critical); }
  .source-note { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); max-width:75ch; }
  .ledger { width:100%; border-collapse:collapse; font-size:12px; }
  .ledger th { color:var(--muted); font-weight:500; font-size:11px; padding:0 0 10px; text-align:right; border-bottom:1px solid var(--line); }
  .ledger th:first-child { text-align:left; }
  .ledger td { padding:12px 0; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
  .ledger td:first-child { text-align:left; font-weight:500; }
  .ledger tr:last-child td { border-bottom:0; }
  .ledger .row-bar { display:inline-block; width:54px; height:4px; border-radius:2px; background:var(--soft); margin-right:12px; vertical-align:middle; }
  .ledger .row-bar i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  .settings-page { max-width:760px; }
  .settings-section { padding:22px 0 26px; border-top:1px solid var(--line); }
  .settings-section h2 { margin-bottom:6px; }
  .settings-section > .caption { margin-bottom:20px; }
  .settings-row { display:flex; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-top:16px; }
  .settings-row label { display:flex; flex-direction:column; gap:7px; flex:1; min-width:180px; font-size:12px; font-weight:500; }
  .settings-row label.check-label { flex-direction:row; align-items:center; min-width:0; gap:10px; font-size:13px; }
  input:not([type="checkbox"]),select { width:100%; min-height:38px; padding:8px 11px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:6px; font-size:13px; }
  input::placeholder { color:var(--muted); opacity:.8; }
  input[type="checkbox"] { accent-color:var(--accent); width:16px; height:16px; margin:0; }
  .btn { min-height:38px; padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--text); font-size:12px; font-weight:550; }
  .btn:hover { background:var(--soft); }
  .btn.primary { color:var(--on-accent); background:var(--accent); border-color:var(--accent); }
  .btn.primary:hover { filter:brightness(.92); }
  .btn.danger { color:var(--critical); }
  .connect { max-width:570px; padding:42px 0 32px; }
  .connect .logo { width:45px; height:58px; margin-bottom:20px; }
  .connect h2 { font-size:24px; letter-spacing:-.03em; margin-bottom:10px; }
  .connect-lead { color:var(--muted); font-size:14px; max-width:55ch; line-height:1.7; }
  .connect-row { display:flex; gap:10px; margin:24px 0 10px; }
  .connect-row input { flex:1; min-width:0; }
  .connection-badge { font-size:11px; color:var(--accent); display:inline-flex; align-items:center; gap:6px; margin:8px 0; }
  .warn-line { padding:12px 16px; border:1px solid var(--critical); background:var(--surface); color:var(--critical); border-radius:7px; font-size:12px; margin-bottom:18px; overflow-wrap:anywhere; }
  .state { color:var(--muted); padding:28px 0; }
  .empty-chart { padding:52px 16px; color:var(--muted); font-size:13px; text-align:center; border-bottom:1px solid var(--line); }
  .success { font-size:12px; color:var(--accent); margin-top:14px; }
  .footer { color:var(--muted); display:flex; justify-content:space-between; gap:16px; font-size:10px; margin-top:30px; padding-top:14px; border-top:1px solid var(--line); }
  .skeleton { height:20px; width:40%; background:var(--soft); border-radius:5px; margin-top:15px; }
  .skeleton.wide { width:100%; height:180px; margin-top:26px; }
  @media(min-width:1350px) { .workspace { padding-left:48px; padding-right:48px; } }
  @media(max-width:1100px) { .overview-grid { grid-template-columns:minmax(0,1fr) 240px; gap:20px; } .workspace { padding:30px 26px; } .metrics { gap:12px; } .metric .v { font-size:24px; } }
  @media(max-width:880px) { .shell { grid-template-columns:160px minmax(0,1fr); } .sidebar { padding-left:10px; padding-right:10px; } .overview-grid { grid-template-columns:1fr; } .quota { display:block; } .quota-facts { margin-top:18px; } .metrics { grid-template-columns:1.4fr 1fr 1fr; } }
  @media(max-width:640px) {
    .shell { display:block; } .sidebar { position:relative; height:auto; padding:20px 20px 12px; border-right:0; border-bottom:1px solid var(--line); }
    .in-app .sidebar { padding-top:45px; } .brand { padding:0; } .brand small { display:none; } .brand .logo { width:20px; height:28px; }
    .nav { flex-direction:row; margin-top:20px; gap:6px; } .nav button { justify-content:center; padding:9px 7px; font-size:12px; } .nav .icon { width:15px; height:15px; }
    .workspace,.in-app .workspace { padding:24px 20px; } .topbar { margin-bottom:22px; gap:10px; } h1 { font-size:23px; } .toolbar { gap:8px; } .live { font-size:10px; }
    .metrics { gap:10px; } .metric .v { font-size:22px; } .metric .k { font-size:10px; } .chart-bars { gap:3px; } .chart { height:164px; }
    .settings-row label { min-width:100%; } .connect { padding-top:20px; } .quota { padding:20px; } .footer { flex-wrap:wrap; } .ledger .row-bar { display:none; }
  }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>

let lang = 'en';
let langPref = 'auto';   // le reglage stocke : "auto", "en" ou "fr"

/* Remplace {cle} par sa valeur. Un motif absent laisse le texte tel quel :
   mieux vaut une accolade visible qu'une phrase amputee en silence. */
const fill = (text, values) =>
  text.replace(/\{(\w+)\}/g, (m, k) => (k in values ? values[k] : m));

const T = s => (lang === 'fr' ? (FR[s] ?? s) : s);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const locale = () => (lang === 'fr' ? 'fr-FR' : 'en-US');

function resolveLang(pref) {
  if (pref === 'fr' || pref === 'en') return pref;
  return String(navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
}

let lastData = null;

/* --- Formatage compact, propre a chaque langue : le francais met une virgule
   decimale, un espace devant l'unite, et ecrit « Md » la ou l'anglais ecrit
   « B ». --- */
function compact(n) {
  const fr = lang === 'fr';
  const num = (v, d) => (fr ? v.toFixed(d).replace('.', ',') : v.toFixed(d));
  const unit = u => (fr ? ' ' : '') + u;
  if (n >= 1e9) return { v: num(n / 1e9, 2), u: unit(fr ? 'Md' : 'B') };
  if (n >= 1e6) return { v: num(n / 1e6, 2), u: unit('M') };
  if (n >= 1e3) return { v: num(n / 1e3, 1), u: unit('k') };
  return { v: String(n), u: '' };
}
const fmt = n => { const c = compact(n); return c.v + c.u; };

/* Seuils de gravité du quota : la barre change de couleur avant le plafond,
   jamais l'inverse — un rouge atteint trop tôt ne veut plus rien dire. */
function severity(ratio) {
  if (ratio >= 0.9) return 'var(--critical)';
  if (ratio >= 0.7) return 'var(--serious)';
  return 'var(--accent)';
}
const exact = n => new Intl.NumberFormat(locale()).format(n);
const pct = x => x > 0 && x < .001 ? (lang === 'fr' ? '< 0,1 %' : '< 0.1%') : (lang === 'fr'
  ? (x * 100).toFixed(1).replace('.', ',') + ' %'
  : (x * 100).toFixed(1) + '%');
const usd = n => n > 0 && n < .01 ? (lang === 'fr' ? '< 0,01 $' : '< $0.01') : (lang === 'fr'
  ? n.toFixed(2).replace('.', ',') + ' $'
  : '$' + n.toFixed(2));


function whenText(days) {
  if (days === null || days === undefined) return '';
  const n = Math.floor(days);
  if (n === 0) return T('today');
  if (n === 1) return T('tomorrow');
  return fill(T('in {n} days'), { n });
}


/* =====================================================================
   /api/balance porte le solde ; /api/usage porte les journees et tokens.

   Sans cle, aucun chiffre n'est publie. L'app affichait auparavant un
   montant colle a la main, presente comme le quota du jour alors qu'il
   pouvait dater de plusieurs semaines.
   ===================================================================== */
function keyStorageHint(q) {
  return T(q.key_storage === 'keychain'
    ? 'The key is protected by macOS Keychain and sent only to ollama.com.'
    : 'The key is saved locally in a private file and sent only to ollama.com.');
}
let nativeNotificationStatus = 'unknown';
function notificationHint() {
  if (!lastData?.notifications_supported) return T('Available in the native macOS app.');
  return T(nativeNotificationStatus === 'denied'
    ? 'Notifications are blocked in macOS System Settings.'
    : 'macOS will ask for permission. One alert per threshold and cycle.');
}
window.setNativeNotificationStatus = status => {
  nativeNotificationStatus = status;
  const hint = document.getElementById('notifications-hint');
  if (hint) hint.textContent = notificationHint();
};

let saveStatusTimer;
function showSaved() {
  const status = document.getElementById('save-status');
  status.textContent = T('Saved');
  status.hidden = false;
  clearTimeout(saveStatusTimer);
  saveStatusTimer = setTimeout(() => { status.hidden = true; }, 3000);
}

    <i class="logo" aria-hidden="true"></i>
    <p class="eyebrow">${T('Connect Ollama Cloud')}</p>
    <h2 id="connect-title">${T('See your spending in one place.')}</h2>

    <div class="connect-row"><label class="visually-hidden" for="api-key">${T('ollama.com API key')}</label>

function localResetHint(q) {
  if (!q.resets_at) return '';

function localDate(timestamp) {
  return new Date(timestamp).toLocaleString(locale(), {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'short'});

function utcDate(timestamp) {
  return new Date(timestamp).toLocaleString(locale(), {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'UTC'})+' UTC';
}

    <section class="settings-section"><h2>${T('Appearance')}</h2><div class="settings-row"><label for="theme-select">${T('Theme')}
      <select id="theme-select"><option value="auto"${theme === 'auto' ? ' selected' : ''}>${T('Automatic')}</option><option value="light"${theme === 'light' ? ' selected' : ''}>${T('Light')}</option><option value="dark"${theme === 'dark' ? ' selected' : ''}>${T('Dark')}</option></select>

function renderQuota(q = {}) {
  const ready = q.source === 'api' && typeof q.ratio === 'number';
  const official = q.measurement === 'balance';
  let body;
  if (ready) {
    const status = q.ratio >= 1 ? 'Cap reached' : q.ratio >= .7 ? 'Approaching cap' : 'Within cap';
    const reset = q.resets_at ? localDate(q.resets_at) : '…';
    body = `<div class="quota-head"><span class="pct">${pct(q.ratio)}</span><span class="quota-tag" style="color:${severity(q.ratio)}">${T(status)}</span></div>
      <div class="meter" role="img" style="--fill:${severity(q.ratio)}" aria-label="${escapeHTML(fill(T('{pct} of the monthly quota consumed'), {pct:pct(q.ratio)}))}"><span style="transform:scaleX(${Math.max(0,Math.min(q.ratio,1)).toFixed(4)})"></span></div>
      <p class="quota-foot">${fill(T('{current} of {monthly}'), {current:usd(q.current || 0), monthly:usd(q.monthly)})}</p>
      <dl class="quota-facts"><div><dt>${T('Remaining')}</dt><dd>${usd(q.remaining ?? Math.max(0,q.monthly-(q.current || 0)))}</dd></div><div><dt>${T(official ? 'Next reset' : 'Configured reset')}</dt><dd class="reset-date" title="${escapeHTML(utcDate(q.resets_at))}">${reset}</dd></div></dl>
      ${q.rate_per_day ? `<details class="projection"><summary>${T('Estimated outlook')}</summary><p>${fill(T('At this rate: <b>+{amount} / day</b>'),{amount:usd(q.rate_per_day)})}${q.projected_at_reset ? '<br>'+fill(T('projected at reset: {amount}'),{amount:usd(q.projected_at_reset)}) : ''}${q.ratio < 1 && q.exhausted_in_days != null && q.days_left != null && q.exhausted_in_days < q.days_left ? `<br><span class="alert">${fill(T('cap reached {when}, before the reset'),{when:whenText(q.exhausted_in_days)})}</span>` : ''}</p></details>` : ''}`;
  } else if (official) {
    body = q.legacy_limits ? `<h3 style="margin-top:20px">${T('Legacy plan')}</h3><p class="hint">${T('Your plan uses session and weekly limits, rather than a monthly dollar allowance.')}</p><dl class="quota-facts">${['session','weekly'].map(name=>`<div><dt>${T(name === 'session' ? 'Session' : 'Weekly')} · ${T('Remaining')}</dt><dd>${pct(q.legacy_limits[name].remaining_percent/100)}<br><span title="${escapeHTML(utcDate(q.legacy_limits[name].resets_at))}">${localDate(q.legacy_limits[name].resets_at)}</span></dd></div>`).join('')}</dl>`
      : `<h3 style="margin-top:20px">${T('No included credits')}</h3>${q.resets_at ? `<p class="hint" title="${escapeHTML(utcDate(q.resets_at))}">${T('Next reset')} · ${localDate(q.resets_at)}</p>` : ''}`;
  } else {
    const issue = q.error === 'partial reset day' ? ['Reset day','Daily spending is available. The quota estimate starts with the first complete UTC day because Ollama cannot split usage at the reset time.']
      : q.error === 'incomplete history' ? ['History incomplete','Some days are missing. Available spending is shown, but a monthly quota cannot be estimated.']
      : q.key_error || q.key_storage_error ? ['Account unavailable','Check the connection in Settings or refresh to try again.']
      : !q.monthly ? ['Cap not configured','Enter a monthly cap to calculate the share consumed.']
      : ['No cycle configured','Set a reset reference to estimate your monthly quota. Daily spending remains available.'];
    body = `<h3 style="margin-top:20px">${T(issue[0])}</h3><p class="hint">${T(issue[1])}</p>`;
  }
  return `<section class="quota" aria-labelledby="quota-h"><h2 id="quota-h">${T(q.legacy_limits ? 'Usage limits' : official ? 'Monthly credits' : 'Estimated monthly quota')}</h2>${body}
    ${official && q.purchased > 0 ? `<dl class="quota-facts"><div><dt>${T('Purchased credits')}</dt><dd>${usd(q.purchased)}</dd></div></dl>` : !official && q.balance_error ? `<p class="hint">${T('Official balance unavailable. The quota below is an estimate.')}</p>` : ''}
    ${official ? '' : `<button class="text-button" type="button" data-view="settings">${T('Manage cycle')} ↗</button>`}</section>`;
}

function periodDays(days, cycleStart, preview = false) {
  if (!days.length) return [];
  const range = preview ? 'cycle' : chartRange === 'cycle' && !cycleStart ? 30 : chartRange;
  const end = Date.parse(days[days.length-1].day+'T00:00:00Z');
  return days.filter(day=>range === 'cycle' || Date.parse(day.day+'T00:00:00Z') > end-range*86400000);
}

function renderTokens(records) {
  if (!records.length) return '';
  const counters = [['input_tokens','Input tokens'],['output_tokens','Output tokens'],['cached_input_tokens','Cached input tokens']];
  const missing = counters.some(([key])=>records.some(day=>day[key] == null));
  return `<section class="tokens" aria-labelledby="tokens-h"><div class="section-head"><h2 id="tokens-h">${T('Tokens in this period')}</h2></div><div class="metrics">${counters.map(([key,label])=>{
    const known = records.every(day=>day[key] != null);
    const total = known ? records.reduce((sum,day)=>sum+day[key],0) : null;
    return `<div class="metric"><span class="k">${T(label)}</span><span class="v" data-token="${key}"${known ? ` title="${exact(total)}"` : ''}>${known ? fmt(total) : '…'}</span></div>`;
  }).join('')}</div>${missing ? `<p class="caption">${T('Some token counters are unavailable for these records. Missing values are not zero.')}</p>` : ''}</section>`;
}

function renderLedger(days, peak) {
  return `<table class="ledger"><caption class="visually-hidden">${T('Daily consumption')}</caption><thead><tr><th scope="col">${T('Date (UTC)')}</th><th scope="col">${T('Requests')}</th><th scope="col">${T('Amount')}</th></tr></thead><tbody>${[...days].reverse().map(j => `<tr><td>${dayLabel(j.day)}</td><td>${exact(j.requests)}</td><td><span class="row-bar" aria-hidden="true"><i style="width:${peak ? Math.min(j.usd/peak,1)*100 : 0}%"></i></span>${usd(j.usd)}</td></tr>`).join('')}</tbody></table>`;
}

function renderChart(days, cycleStart = null, preview = false, partialDay = null) {
  const end = days.length ? Date.parse(days[days.length-1].day+'T00:00:00Z') : 0;
  const range = preview ? 'cycle' : chartRange === 'cycle' && !cycleStart ? 30 : chartRange;
  const beginning = cycleStart ? Date.parse(new Date(cycleStart).toISOString().slice(0,10)+'T00:00:00Z') : days.length ? Date.parse(days[0].day+'T00:00:00Z') : 0;
  const start = days.length ? range === 'cycle' ? beginning : Math.max(beginning,end-(range-1)*86400000) : 0;
  const byDay = new Map(days.map(day=>[day.day,day]));
  const shown = [];
  if (days.length) for (let ts=start; ts<=end; ts+=86400000) {
    const day = new Date(ts).toISOString().slice(0,10);
    shown.push(byDay.get(day) || {day,usd:null,requests:null});
  }
  const peak = Math.max(0,...shown.map(d=>d.usd));
  const selected = shown.find(d=>d.day === selectedDay) || shown[shown.length-1];
  selectedDay = selected?.day || null;
  const ticks = [...new Set([shown[0]?.day,shown[Math.floor((shown.length-1)/2)]?.day,shown[shown.length-1]?.day])].filter(Boolean);
  return `<div class="section-head"><h2>${T(preview ? 'Cycle trend' : 'Daily activity')}</h2>${preview ? `<button class="text-button" type="button" data-view="activity">${T('View all activity')} ↗</button>` : `<div class="segmented" role="group" aria-label="${T('Daily activity')}">${(cycleStart ? ['cycle',7,30] : [7,30]).map(n=>`<button type="button" data-chart-range="${n}"${shown.length ? '' : ' disabled'} aria-pressed="${range===n}">${T(n === 'cycle' ? 'Current cycle' : n+' days')}</button>`).join('')}</div>`}</div>
    ${!shown.length ? `<div class="empty-chart">${T('No daily records yet.')}<br>${T('Once Ollama publishes usage, it will appear here.')}</div>` : `
    <div class="chart"><span class="chart-scale">${usd(peak)}</span><div class="chart-grid" aria-hidden="true"><span></span><span></span><span></span></div><div class="chart-bars">${shown.map(j=>`<button class="chart-day${j.usd===null ? ' missing' : j.usd===0 ? ' zero' : ''}" type="button" data-select-day="${escapeHTML(j.day)}" aria-pressed="${selectedDay===j.day}" aria-label="${escapeHTML(dayLabel(j.day)+': '+(j.usd === null ? T('No record for this day') : usd(j.usd)+', '+exact(j.requests)+' '+T('requests')))}" title="${escapeHTML(dayLabel(j.day)+': '+(j.usd === null ? T('No record for this day') : usd(j.usd)))}"><span style="--height:${peak ? (j.usd/peak*90).toFixed(2) : 0}%"></span></button>`).join('')}</div></div>
    <div class="chart-axis">${ticks.map((day,i)=>`<span>${shortDate(day)}${i === ticks.length-1 ? ' · UTC' : ''}</span>`).join('')}</div>`}
    ${selected && !preview ? `<div class="chart-detail" id="chart-detail" role="status"><div><strong>${dayLabel(selected.day)}</strong><p class="caption">${selected.usd === null ? T('No record for this day') : exact(selected.requests)+' '+T(selected.requests === 1 ? 'request' : 'requests')}${selected.day === partialDay ? ' · '+T('Renewal day') : ''}</p></div><span class="amount">${selected.usd === null ? '…' : usd(selected.usd)}</span></div>${selected.usd !== null ? `<details class="selected-tokens"><summary>${T('Day tokens')}</summary><p class="caption">${[['input_tokens','Input tokens'],['output_tokens','Output tokens'],['cached_input_tokens','Cached input tokens']].map(([key,label])=>T(label)+': '+(selected[key] == null ? '…' : exact(selected[key]))).join(' · ')}</p></details>` : ''}` : ''}`;
}

function renderContent(data) {
  const app = document.getElementById('app');
  const days = data.daily_days || [];
  const sub = document.getElementById('sub');
  document.getElementById('view-title').textContent = T(VIEW_TITLES[currentView]);
  document.querySelectorAll('.nav [data-view]').forEach(el=>{
    if (el.dataset.view === currentView) el.setAttribute('aria-current','page');
    else el.removeAttribute('aria-current');
  });
  sub.hidden = currentView === 'settings' || !data.usage_available;
  sub.removeAttribute('title');
  if (data.activity_start) {
    sub.textContent = fill(T(data.activity_start_source === 'balance' ? 'Cycle started on {date}' : 'Configured cycle started on {date}'),{date:new Date(data.activity_start).toLocaleDateString(locale(),{day:'numeric',month:'short'})});
    sub.title = utcDate(data.activity_start);
  } else if (days.length) sub.textContent = fill(T('Spending shown from {from} to {to} (UTC).'),{from:shortDate(days[0].day),to:shortDate(days[days.length-1].day)});
  else sub.textContent = T('Ollama Cloud usage');
  if (currentView === 'settings') { app.innerHTML = renderSettings(data); return; }
  if (!data.usage_available) {
    app.innerHTML = data.quota?.measurement === 'balance'
      ? `<div class="overview-grid"><section><h2>${T('Daily spending unavailable')}</h2><p class="hint">${T('The balance remains available. Refresh to try loading daily activity again.')}</p></section><aside>${renderQuota(data.quota)}</aside></div>`
      : renderConnection({...data.quota,key_error:data.usage_error || data.quota?.key_error});
    return;
  }
  const overview = currentView === 'overview';
  const records = periodDays(days,data.activity_start);
  const today = days.find(day=>day.day === new Date().toISOString().slice(0,10));
  const spending = overview ? today?.usd : records.length ? records.reduce((sum,day)=>sum+day.usd,0) : null;
  const requests = overview ? today?.requests : records.length ? records.reduce((sum,day)=>sum+day.requests,0) : null;
  const peak = Math.max(0,...records.map(day=>day.usd));
  const metrics = `<div class="metrics two"><div class="metric"><span class="k">${T(overview ? 'Today (UTC)' : 'Period spending')}</span><span class="v" id="hero">${spending == null ? '…' : usd(spending)}</span></div><div class="metric"><span class="k">${T(overview ? 'Requests today' : 'Requests recorded')}</span><span class="v" id="request-total"${requests == null ? '' : ` title="${exact(requests)}"`}>${requests == null ? '…' : fmt(requests)}</span></div></div>`;
  const official = data.quota?.measurement === 'balance';
  const boundary = data.activity_partial_day ? `<p id="renewal-note">${fill(T('The record for {date} covers the whole UTC day and may include usage before renewal.'),{date:shortDate(data.activity_partial_day)})}${official ? ' '+T('The monthly credit balance uses the exact renewal time.') : ''}</p>` : '';
  const source = `<details class="source-note"><summary>${T('Understand the data')}</summary><p>${T(data.quota?.legacy_limits ? 'Your plan uses session and weekly limits, rather than a monthly dollar allowance.' : official ? 'Monthly credits come from Ollama’s official balance. Purchased credits are separate. Charts show daily spending, which can include both types of credits.' : 'Cycle spending is estimated from complete UTC days. The first partial day is excluded. This is not a balance published by Ollama.')}</p><p>${T('Daily records use UTC days.')} ${T('Requests recorded are the sum of calls in the available daily records for the selected period.')}</p><p>${T('Cached tokens are included in input tokens. They are not added again.')}</p>${boundary}<p>${T('For teams, the credit balance is shared while activity is personal.')}</p></details>`;
  app.innerHTML = overview
    ? `<div class="overview-grid"><section class="activity-panel" aria-label="${T('Overview')}">${metrics}${renderChart(days,data.activity_start,true,data.activity_partial_day)}</section><aside>${renderQuota(data.quota)}</aside></div>${source}`
    : `${metrics}${renderChart(days,data.activity_start,false,data.activity_partial_day)}${renderTokens(records)}${records.length ? `<div class="section-head"><h2>${T('Daily records')}</h2></div>${renderLedger(records,peak)}` : ''}${source}`;
}

// A push must preserve unfinished settings, even after focus left a field.
const drafts = new Map();
const detailStates = new Map();
let renderedView = 'overview';
function render(data) {
  const app = document.getElementById('app');
  const active = document.activeElement;
  const focusedId = active && app.contains(active) ? active.id : null;
  const focusedDay = active?.dataset?.selectDay;
  const focusedRange = active?.dataset?.chartRange;
  const selection = active?.type === 'password' ? [active.selectionStart,active.selectionEnd] : null;
  for (const el of app.querySelectorAll('details')) detailStates.set(renderedView+':'+el.className,el.open);
  renderContent(data);
  for (const el of app.querySelectorAll('details')) el.open = detailStates.get(currentView+':'+el.className) || false;
  renderedView = currentView;
  for (const [id,value] of drafts) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }
  const focused = focusedId ? document.getElementById(focusedId)
    : focusedDay ? document.querySelector(`[data-select-day="${focusedDay}"]`)
    : focusedRange ? document.querySelector(`[data-chart-range="${focusedRange}"]`) : null;
  if (focused) {
    focused.focus({preventScroll:true});
    if (selection) focused.setSelectionRange(...selection);
  }
}

document.addEventListener('input',e=>{
  if (e.target.matches('#monthly,#api-key')) drafts.set(e.target.id,e.target.value);
});
document.addEventListener('click',e=>{
  const button = e.target.closest('button');
  if (!button) return;
  if (button.dataset.view) {
    disconnectPending = false;
    document.getElementById('save-status').hidden = true;
    currentView = button.dataset.view;
    if (lastData) render(lastData);
    document.getElementById('main').focus({preventScroll:true});
  }
  if (button.dataset.chartRange) {
    chartRange = button.dataset.chartRange === 'cycle' ? 'cycle' : Number(button.dataset.chartRange);
    if (lastData) render(lastData);
    document.querySelector(`[data-chart-range="${chartRange}"]`)?.focus({preventScroll:true});
  }
  if (button.dataset.selectDay) {
    selectedDay = button.dataset.selectDay;
    if (currentView === 'overview') { currentView = 'activity'; chartRange = lastData?.activity_start ? 'cycle' : 30; }
    if (lastData) render(lastData);
    document.querySelector(`[data-select-day="${selectedDay}"]`)?.focus({preventScroll:true});
  }
});

const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';

// Les préférences suivent le système par défaut et sont partagées avec le panneau.
const LANGS = ['auto', 'en', 'fr'];

function applyTheme(value) {
  theme = THEMES.includes(value) ? value : 'auto';
  const root = document.documentElement;
  if (theme === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', theme);


}

/* Applique la langue et repeint ce qui ne depend pas du rendu : le titre de
   l'onglet, le lien d'evitement, les infobulles. Le corps est redessine par
   render() — la signature du flux porte `lang`, donc un changement force un
   rendu complet sans qu'on ait a le demander ici. */
function applyLang(value) {
  langPref = LANGS.includes(value) ? value : 'auto';
  lang = resolveLang(langPref);

  document.documentElement.lang = lang;
  document.title = T('Ollama Buddy — Ollama Cloud usage');

  // Le texte d'attente, tant que le premier envoi du serveur n'est pas arrive.
  // Il disparait avec #app des le premier rendu : la recherche renvoie alors
  // null et il n'y a plus rien a traduire.
  const boot = document.getElementById('boot');
  if (boot) boot.textContent = T('Reading…');

  const skip = document.querySelector('.skip');
  if (skip) skip.textContent = T('Skip to content');
  const sub = document.getElementById('sub');
  if (sub && !sub.hidden) sub.textContent = T('Ollama Cloud usage');
  const refresh = document.getElementById('refresh');
  if (refresh) {
    refresh.setAttribute('aria-label', T('Refresh usage'));
    refresh.title = T('Ask ollama.com for usage again without waiting for the cache to expire');
  }
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  document.getElementById('view-title').textContent = T(VIEW_TITLES[currentView]);
  applyTheme(theme);
  setLive(liveState);  // « En direct » / « Live » suit la langue
}

/* Un reglage change : on l'applique tout de suite, on force le rendu sans
   attendre le prochain battement du flux, et on le dit au serveur. L'echec
   reseau n'est pas fatal — le reglage vaut deja pour cette vue. */
function changeLang(value) {
  applyLang(value);
  lastSignature = '';
  if (lastData) applyData({ ...lastData, lang: value });
  savePreference('/api/lang', { lang: value });
}

async function savePreference(path, payload) {
  const errorEl = document.getElementById('action-error');
  errorEl.hidden = true;
  try {
    const response = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
    showSaved();
    if (path === '/api/notifications') {
      window.webkit?.messageHandlers?.app?.postMessage('notificationsChanged');
    }
  } catch (err) {
    errorEl.textContent = fill(T('Request failed: {error}'), { error: err.message });
    errorEl.hidden = false;
    lastSignature = '';
    await load();
  }
}

document.addEventListener('change', e => {
  if (e.target.id !== 'theme-select') return;
  const value = e.target.value;
  applyTheme(value);
  if (lastData) lastData = { ...lastData, theme: value };
  savePreference('/api/theme', { theme: value });
});

/* =====================================================================
   Chargement : flux pousse par le serveur (SSE), avec repli sur un fetch
   si les flux ne sont pas disponibles.
   ===================================================================== */
let stream = null;
let pollingTimer = null;
let lastSignature = '';

function applyData(data) {
  /* Rien de neuf ? On ne redessine pas : sinon les animations d'entree
     rejoueraient a chaque battement du flux. */
  const signature = JSON.stringify({
    daily_days: data.daily_days, usage_available: data.usage_available, usage_error:data.usage_error,
    activity_start: data.activity_start, activity_start_source:data.activity_start_source, activity_partial_day:data.activity_partial_day,
    notifications: data.notifications, notifications_supported: data.notifications_supported,
    quota: { ...data.quota, days_left: Math.floor(data.quota?.days_left ?? -1) },
    theme: data.theme, lang: data.lang,
  });
  if (signature === lastSignature) return;
  lastSignature = signature;

  lastData = data;
  if (data.theme) applyTheme(data.theme);
  if (data.lang) applyLang(data.lang);

  render(data);
}

let liveState = 'connecting';

function setLive(state) {
  liveState = state;   // retenu : applyLang redessine ce libelle
  const el = document.getElementById('live');
  el.hidden = false;
  el.classList.toggle('stale', state !== 'on');
  el.lastElementChild.textContent =
    T(state === 'on' ? 'Live' : state === 'off' ? 'Reconnecting…' : 'Connecting…');
}

function connect() {
  if (stream) { stream.close(); stream = null; }
  if (pollingTimer !== null) { clearInterval(pollingTimer); pollingTimer = null; }

  if (!('EventSource' in window)) {   // repli : interrogation periodique
    setLive('off');
    load();
    pollingTimer = setInterval(load, 5000);
    return;
  }

  setLive('connecting');
  stream = new EventSource('/api/stream');
  stream.onopen = () => setLive('on');
  stream.onmessage = event => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    setLive('on');
    applyData(data);

  };
  stream.onerror = () => setLive('off');   // EventSource se reconnecte seul
}

/* Repli sans flux : un simple aller-retour HTTP. */
async function load() {
  try {
    const res = await fetch('/api/usage');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    applyData(await res.json());
    setLive('on');
  } catch (err) {
    setLive('off');
    document.getElementById('app').innerHTML =
      `<p class="state" role="alert">${fill(T('Could not read usage: {error}'), { error: escapeHTML(err.message) })}</p>`;
  }
}

/* --- Quota : les controles sont recrees a chaque rendu, on delegue --- */
async function postQuota(payload, button) {
  if (button) button.disabled = true;
  const errorEl = document.getElementById('action-error');
  errorEl.hidden = true;
  try {
    const res = await fetch('/api/quota', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    lastSignature = '';
    await load();
    showSaved();
  } catch (err) {
    errorEl.textContent = fill(T('Request failed: {error}'), { error: err.message });
    errorEl.hidden = false;
    throw err;
  }
  finally { if (button) button.disabled = false; }
}

document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;


  if (btn.id === 'save-monthly') {
    const raw = document.getElementById('monthly').value.trim();
    // Vide veut dire « suis l'offre » : c'est la valeur par defaut, et le seul
    // chemin de retour une fois un plafond saisi.
    const value = raw === '' ? 0 : parseFloat(raw);
    if (!Number.isFinite(value) || value < 0) {
      const errorEl = document.getElementById('action-error');
      errorEl.textContent = T('Enter a positive amount, or leave empty to follow your plan.');
      errorEl.hidden = false;
      document.getElementById('monthly').focus();
      return;
    }
    drafts.delete('monthly');
    postQuota({ monthly_quota: value }, btn).catch(() => { drafts.set('monthly', raw); });
  }

  if (btn.id === 'refresh') {
    /* Le serveur purge son cache et redemande l'usage a ollama.com : sans ca,
       la part du quota resterait figee une minute de plus. */
    btn.setAttribute('aria-busy', 'true');
    btn.disabled = true;
    fetch('/api/refresh', { method: 'POST' })
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); })
      .catch(err => {
        const errorEl = document.getElementById('action-error');
        errorEl.textContent = fill(T('Request failed: {error}'), {error:err.message});
        errorEl.hidden = false;
      })
      .finally(() => {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        reload();
      });
  }

  if (btn.id === 'save-key') {
    const field = document.getElementById('api-key');
    const key = field.value.trim();
    if (!key) { field.focus(); return; }
    // Le champ est vide des l'envoi : le secret ne reste pas dans le DOM.
    field.value = '';
    drafts.delete('api-key');
    postQuota({ ollama_api_key: key }, btn).then(reload).catch(() => {});
  }

  if (btn.id === 'remove-key') {
    disconnectPending = true;
    if (lastData) render(lastData);
    document.getElementById('cancel-disconnect')?.focus();
  }
  if (btn.id === 'cancel-disconnect') {
    disconnectPending = false;
    if (lastData) render(lastData);
    document.getElementById('remove-key')?.focus();
  }
  if (btn.id === 'confirm-disconnect') {
    disconnectPending = false;
    drafts.clear();
    postQuota({ ollama_api_key: '' }, btn).then(reload).catch(() => {});
  }
});

/* Changer de cle change ce qu'ollama.com accepte de repondre — ou refuse de
   repondre. Le flux doit repartir de zero, sinon la vue reste sur l'ancien
   etat jusqu'au prochain push, qui peut tarder. */
function reload() {
  lastSignature = '';
  connect();
}

/* Entree dans un champ de quota : on valide sans quitter le champ. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'monthly') document.getElementById('save-monthly')?.click();
  if (id === 'api-key') document.getElementById('save-key')?.click();
});

document.addEventListener('change', e => {
  if (e.target.id !== 'reset-at') return;
  if (!e.target.value) {
    postQuota({ quota_reset_at: 0 }).catch(() => {});
    return;
  }
  const when = new Date(e.target.value + 'Z');
  if (Number.isNaN(when.getTime())) return;
  postQuota({ quota_reset_at: when.getTime() }).catch(() => {});
});

document.addEventListener('change', e => {
  if (e.target.id !== 'notifications') return;
  const notifications = e.target.checked;
  if (lastData) lastData = { ...lastData, notifications };
  savePreference('/api/notifications', { notifications });
});

// Les réglages de langue sont partagés avec le panneau natif.
document.addEventListener('change', e => {
  if (e.target.id !== 'lang-select') return;
  changeLang(e.target.value);
});


/* Revenir sur l'onglet ne doit pas laisser une vue figee. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!stream || stream.readyState === 2)) {
    lastSignature = '';
    connect();
  }
});

/* Peinture immediate : navigator.language est disponible tout de suite, donc
   un Mac en francais ne voit pas passer une interface anglaise. Le reglage du
   serveur, s'il est explicite, corrige au premier envoi. */
applyLang('auto');
connect();
</script>
