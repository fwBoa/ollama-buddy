<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Buddy — Ollama Cloud model usage</title>
<link rel="icon" href="ollama.png" type="image/png">
<script>
  /* Pose avant le premier rendu, sinon le contenu saute quand la classe
     arrive. La fenetre native reserve la place des feux tricolores. */
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app) {
    document.documentElement.classList.add('in-app');
  }
</script>
<style>
  /* =====================================================================
     Tokens. Palette catégorielle validée en clair et en sombre par le
     validateur dataviz (bande de clarté, chroma, séparation daltonienne,
     contraste sur la surface). Ne pas modifier une teinte isolément.
     ===================================================================== */
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --surface-raised: #ffffff;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #6e6c67;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --ghost:          rgba(11,11,11,0.04);
    --shadow:         0 1px 2px rgba(11,11,11,.05), 0 6px 20px rgba(11,11,11,.05);
    /* Gravite et accent sont calibres PAR THEME, au contraste mesure : 4,5:1
       pour le texte, 3:1 pour un remplissage. Un ambre ou un orange clair
       tient sur le fond sombre mais pas sur le fond clair, et un rouge assez
       sombre pour le clair ne tient plus sur le sombre — d'ou deux jeux. */
    --good:      #006300;
    --warning:   #c57f00;
    --serious:   #bc572e;
    --critical:  #d03b3b;
    --accent:    #2271ce;
    /* L'accent sert de couleur de TEXTE (liens) : il doit etre clair sur fond
       sombre. Mais il sert aussi de FOND a du texte blanc, ou il doit etre
       sombre. Deux roles opposes — d'ou ce second jeton, assez sombre pour
       porter du blanc dans les deux themes (5,7:1). */
    --accent-solid: #1f66bb;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#898781;

    /* Courbes d'easing fortes : les valeurs CSS natives manquent de mordant. */
    --ease-out:   cubic-bezier(0.23, 1, 0.32, 1);
    --ease-inout: cubic-bezier(0.77, 0, 0.175, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #141413;
      --surface-raised: #1b1b19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --ghost:          rgba(255,255,255,0.05);
      --shadow:         0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.3);
      --good:      #0ca30c;
      --warning:   #fab219;
      --serious:   #ec835a;
      --critical:  #de4946;
      --accent:    #3987e5;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#898781;
    }
  }
  /* Memes valeurs, pour forcer le sombre quand le systeme est en clair.
     Le theme sombre est choisi, pas deduit : ses pas sont validés pour la
     surface sombre. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #141413;
    --surface-raised: #1b1b19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --ghost:          rgba(255,255,255,0.05);
    --shadow:         0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.3);
    --good:      #0ca30c;
    --warning:   #fab219;
    --serious:   #ec835a;
    --critical:  #de4946;
    --accent:    #3987e5;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#898781;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* --- Focus : jamais supprime, toujours visible au clavier (WCAG 2.4.7) --- */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* --- Lien d'evitement (WCAG 2.4.1) --- */
  .skip {
    position: absolute; left: 50%; top: 8px; transform: translate(-50%, -200%);
    z-index: 100; padding: 10px 18px; border-radius: 10px;
    background: var(--accent-solid); color: #fff; font-size: 14px; font-weight: 600;
    text-decoration: none; transition: transform 160ms var(--ease-out);
  }
  .skip:focus-visible { transform: translate(-50%, 0); }

  .wrap {
    max-width: 1560px; margin: 0 auto;
    padding: 0 clamp(16px, 2.5vw, 44px) 72px;
  }

  /* --- Barre superieure translucide, facon materiau Apple --- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 18px clamp(16px, 2.5vw, 44px) 16px;
    margin: 0 calc(-1 * clamp(16px, 2.5vw, 44px)) 22px;
    background: color-mix(in oklab, var(--page) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }

  /* Le lama, en masque : il prend la couleur du texte et suit donc les deux
     themes sans qu'il faille deux fichiers. */
  .logo {
    width: 16px; height: 22px; flex: 0 0 auto; margin-right: 2px;
    background-color: var(--text-primary);
    -webkit-mask: url("ollama.png") center / contain no-repeat;
    mask: url("ollama.png") center / contain no-repeat;
  }

  /* Dans la fenetre native le contenu passe sous la barre de titre : on
     reserve la place des feux, sinon le titre du document chevauche le leur. */
  html.in-app .topbar { padding-top: 34px; }
  html.in-app .logo { width: 18px; height: 25px; }
  .plan {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--good); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  /* Indicateur de flux : le serveur pousse, on le montre. */
  .live {
    display: inline-flex; align-items: center; gap: 7px; margin-left: auto;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted);
  }
  .live i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: 0 0 auto;
    transition: background-color 200ms var(--ease-out);
  }
  .live.stale i { background: var(--warning); }
  .live.pulse i { animation: beat 420ms var(--ease-out); }
  @keyframes beat {
    0%   { transform: scale(1);   opacity: 1; }
    45%  { transform: scale(2.4); opacity: .3; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .sub { color: var(--text-secondary); font-size: 13.5px; margin: 0 0 24px; max-width: 92ch; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; flex: 0 0 36px;
    font: inherit; font-size: 15px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 9px;
    cursor: pointer;
    transition: transform 120ms var(--ease-out), color 160ms var(--ease-out),
                background 160ms var(--ease-out);
  }
  .icon-btn:active { transform: scale(0.94); }
  @media (hover: hover) and (pointer: fine) {
    .icon-btn:hover { color: var(--text-primary); background: var(--ghost); }
  }
  .icon-btn[aria-busy="true"] span { display: inline-block; animation: spin 600ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Le contenu s'estompe pendant un changement de periode au lieu d'etre
     remplace par un ecran "Chargement" qui clignote. */
  #app { transition: opacity 180ms var(--ease-out); }
  #app.switching { opacity: 0.45; }

  /* --- Titre auto-informatif : le graphique porte sa propre lecture --- */
  .headline {
    font-size: 15px; color: var(--text-secondary); margin: 0 0 20px; line-height: 1.6;
  }
  .headline b { color: var(--text-primary); font-weight: 600; }

  /* --- Chiffre hero : un seul par vue. Flex plutot que grid fixe, pour que
     les tuiles se replacent d'elles-memes selon la largeur. --- */
  .hero-row {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    gap: clamp(20px, 3vw, 52px);
    margin-bottom: clamp(30px, 3vw, 42px);
  }
  .hero-figure { flex: 1 1 240px; min-width: 0; }
  .hero-value {
    font-size: clamp(2.5rem, 4.6vw, 3.7rem);
    font-weight: 600; line-height: 0.98; letter-spacing: -0.03em;
  }
  .hero-unit { font-size: clamp(1.1rem, 1.9vw, 1.6rem); font-weight: 500; color: var(--text-secondary); margin-left: 5px; }
  .hero-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }

  .stat { display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; flex: 0 1 auto; min-width: 104px; }
  .stat .k { font-size: 12px; color: var(--text-muted); }
  .stat .v { font-size: clamp(1.05rem, 1.5vw, 1.25rem); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* --- Bloc du bas : le quota et la repartition se partagent la largeur. --- */
  .split { display: grid; gap: clamp(28px, 3vw, 48px); align-items: start; }
  @media (min-width: 940px) {
    .split { grid-template-columns: minmax(300px, 1fr) minmax(0, 1.45fr); }
  }
  .split .quota { margin-top: 0; }
  .split .section-title { margin-top: 0; }
  .stack { display: flex; flex-direction: column; gap: clamp(28px, 3vw, 40px); min-width: 0; }

  /* --- Container queries : les composants repondent a LEUR largeur, pas a
     celle de la fenetre. --- */
  .models { container-type: inline-size; }
  @container (max-width: 430px) {
    .model { grid-template-columns: 15px 1fr auto; }
    .model .bar { display: none; }
  }
  /* --- Quota mensuel : la seule mesure qui couvre tous les clients --- */
  .quota { margin-top: 40px; }
  .quota-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .quota-head .t { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .quota-head .pct { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter {
    height: 12px; border-radius: 999px; overflow: hidden;
    background: color-mix(in oklab, var(--fill) 20%, var(--surface-1));
  }
  /* On anime transform, pas width : scaleX reste sur le GPU et ne declenche
     ni layout ni paint. Le rayon du parent borne le rendu. */
  .meter > span {
    display: block; height: 100%; width: 100%; border-radius: 999px;
    background: var(--fill);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 280ms var(--ease-out);
  }
  .quota-foot {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 9px; font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
  }
  .quota-rate { margin-top: 14px; font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .quota-rate b { color: var(--text-primary); font-weight: 600; }
  .quota-rate .alert { color: var(--critical); font-weight: 600; }


  /* Source lue en direct : plus de saisie, juste d'ou vient le chiffre. */
  .quota-source {
    margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--gridline);
    font-size: 12.5px; color: var(--text-muted); line-height: 1.65;
  }
  .quota-source b { color: var(--text-secondary); font-weight: 600; }

  /* --- Connexion du compte (BYOK) : la seule porte d'entree vers la cle --- */
  .connect {
    margin-bottom: 22px; padding: 16px 18px;
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 12px;
  }
  .connect-lead { margin: 0 0 13px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .connect-lead b { color: var(--text-primary); font-weight: 600; }
  .connect-lead .bad { color: var(--critical); }
  .connect-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .connect input {
    font: inherit; font-size: 13px; flex: 1 1 190px; min-width: 0;
    padding: 8px 11px; min-height: 34px;
    color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px;
    transition: border-color 160ms var(--ease-out);
  }
  .connect input:hover { border-color: var(--baseline); }
  .connect .hint { margin: 11px 0 0; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  /* La cle ne doit jamais repartir vers le navigateur : le champ est toujours vide. */
  .connect input::placeholder { color: var(--text-muted); }
  a { color: var(--accent); }

  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 11.5px; background: var(--ghost); padding: 1px 5px; border-radius: 4px;
  }

  .btn {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; min-height: 34px; cursor: pointer;
    transition: transform 120ms var(--ease-out), background-color 160ms var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--ghost); } }
  /* L'action attendue du bloc : une seule par ecran, jamais deux. */
  .btn.primary {
    color: #fff; background: var(--accent-solid); border-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) { .btn.primary:hover { background: var(--accent-solid); filter: brightness(1.08); } }
  .btn[disabled] { opacity: .55; cursor: default; }
  details.quota-settings { margin-top: 16px; }
  details.quota-settings summary {
    cursor: pointer; font-size: 12.5px; color: var(--text-muted); padding: 8px 0;
    list-style: none; min-height: 24px;
  }
  details.quota-settings summary::-webkit-details-marker { display: none; }
  details.quota-settings summary::before {
    content: "▸"; display: inline-block; width: 16px;
    transition: transform 180ms var(--ease-out);
  }
  details.quota-settings[open] summary::before { transform: rotate(90deg); }
  .settings-row {
    display: flex; gap: 20px; flex-wrap: wrap; padding: 6px 0 10px 16px;
    font-size: 13px; color: var(--text-secondary);
  }
  .settings-row label { display: flex; align-items: center; gap: 8px; }
  .settings-row input, .settings-row select {
    font: inherit; font-size: 13px; padding: 7px 10px; min-height: 34px;
    color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .settings-row input[type="number"] { width: 84px; }
  .settings-row input[type="password"] { width: 230px; }
  .quota-settings .hint {
    display: block; margin: 0; padding: 0 0 10px 16px;
    font-size: 12px; color: var(--text-muted); line-height: 1.6;
  }

  /* --- Repartition par modele --- */
  .section-title {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted); margin: 46px 0 16px;
  }
  .models { display: flex; flex-direction: column; }
  .model {
    display: grid; grid-template-columns: 15px minmax(0, auto) minmax(46px, 1fr) auto;
    align-items: center; gap: 14px; padding: 13px 12px; margin: 0 -12px;
    border-radius: 11px;
    /* Le delai vit ici, pas dans .stagger : declare dans la regle qui porte la
       classe, il disparaitrait au moment meme ou l'on retire la classe, et les
       lignes partiraient toutes ensemble. Le survol, lui, reste sans delai. */
    --d: 0ms;
    transition:
      opacity 260ms var(--ease-out) var(--d),
      transform 260ms var(--ease-out) var(--d),
      background-color 150ms var(--ease-out);
  }
  .model:nth-child(2) { --d: 45ms; }
  .model:nth-child(3) { --d: 90ms; }
  .model:nth-child(4) { --d: 135ms; }
  .model:nth-child(5) { --d: 180ms; }
  .model:nth-child(n+6) { --d: 215ms; }

  /* La classe .stagger n'existe qu'au premier rendu d'une periode : les
     mises a jour temps reel ne doivent pas faire rejouer l'entree. */
  .models.stagger .model { opacity: 0; transform: translateY(6px); }
  .model + .model { border-top: 1px solid var(--gridline); }
  @media (hover: hover) and (pointer: fine) {
    .model:hover { background: var(--ghost); }
  }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .model-name { font-size: 13.5px; font-weight: 500; min-width: 0; }
  .model-name .id { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-name .n { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-muted); margin-top: 2px; }
  .bar { height: 10px; background: var(--gridline); border-radius: 3px; overflow: hidden; }
  .bar > span {
    display: block; height: 100%; width: 100%; background: var(--c);
    border-radius: 0 4px 4px 0;
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 300ms var(--ease-out);
  }
  .model-stats { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .model-stats .tok { font-size: 13.5px; font-weight: 600; }
  .model-stats .pct { font-size: 12px; color: var(--text-secondary); margin-left: 9px; }

  /* --- Vue tableau : repli accessible, jamais la couleur seule --- */

  .warn-line { margin-top: 14px; color: var(--serious); font-size: 12.5px; }

  .state { color: var(--text-muted); font-size: 14px; padding: 56px 0; text-align: center; }

  @media (max-width: 560px) {
    .hero-row { gap: 18px 20px; }
    .stat { flex: 1 1 45%; min-width: 0; }
  }

  /* --- Mouvement reduit : on garde les fondus, on retire les deplacements --- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .model { opacity: 1; animation: none !important; }
    .models.stagger .model { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div class="wrap">
  <header class="topbar">
    <i class="logo" aria-hidden="true"></i>
    <h1>Ollama Buddy</h1>
    <span class="plan" id="plan" hidden></span>
    <span class="live" id="live" role="status" aria-live="polite" hidden>
      <i aria-hidden="true"></i><span>Connecting…</span>
    </span>
    <button type="button" class="icon-btn" id="refresh"
            aria-label="Refresh usage"
            title="Ask ollama.com for usage again without waiting for the cache to expire">
      <span aria-hidden="true">↻</span>
    </button>
    <button type="button" class="icon-btn" id="theme" aria-label="Change theme"
            title="Theme: automatic">
      <span aria-hidden="true" id="theme-icon">◐</span>
    </button>
    <button type="button" class="icon-btn" id="lang" aria-label="Change language"
            title="Language: automatic">
      <span aria-hidden="true" id="lang-icon">EN</span>
    </button>
  </header>

  <main id="main">
    <p class="sub" id="sub">Ollama Cloud usage</p>

    <div id="app"><p class="state" id="boot">Reading…</p></div>
  </main>
</div>

<script>
"use strict";

const SLOTS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8','--s9'];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

/* =====================================================================
   Langue. Le serveur ne stocke qu'une preference — "auto", "en", "fr" — et
   ne choisit pas a la place du navigateur : il ignore quelle langue parle la
   machine. "auto" se resout donc ici, une fois pour toutes.

   La traduction se fait par la chaine anglaise elle-meme : le francais est un
   dictionnaire a plat, et une cle absente retombe sur l'anglais plutot que
   d'afficher un trou. Un texte neuf non traduit reste lisible.
   ===================================================================== */
const FR = {
  'Ollama Buddy — Ollama Cloud model usage': 'Ollama Buddy — consommation des modèles Ollama Cloud',
  'Skip to content': 'Aller au contenu',
  'Connecting…': 'Connexion…',
  'Refresh usage': 'Rafraîchir la consommation',
  "Ask ollama.com for usage again without waiting for the cache to expire": "Redemander l'usage à ollama.com sans attendre la fin du cache",
  'Change theme': 'Changer de thème',
  'Theme: automatic': 'Thème : automatique',
  'Theme: light': 'Thème : clair',
  'Theme: dark': 'Thème : sombre',
  'Change language': 'Changer de langue',

let lang = 'en';
let langPref = 'auto';   // le reglage stocke : "auto", "en" ou "fr"

/* Remplace {cle} par sa valeur. Un motif absent laisse le texte tel quel :
   mieux vaut une accolade visible qu'une phrase amputee en silence. */
const fill = (text, values) =>
  text.replace(/\{(\w+)\}/g, (m, k) => (k in values ? values[k] : m));

/* Le source est indentee : une phrase ecrite sur plusieurs lignes porte les
   espaces de son indentation. En HTML ces suites se reduisent a un seul espace
   a l'affichage — la recherche normalise donc les deux cotes, sinon aucune
   cle multiligne ne serait trouvee. */
const squeeze = s => s.replace(/\s+/g, ' ').trim();
const FR_BY_KEY = new Map(Object.entries(FR).map(([k, v]) => [squeeze(k), v]));

const T = s => (lang === 'fr' ? (FR_BY_KEY.get(squeeze(s)) ?? s) : s);
const locale = () => (lang === 'fr' ? 'fr-FR' : 'en-US');

function resolveLang(pref) {
  if (pref === 'fr' || pref === 'en') return pref;
  return String(navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
}

let lastData = null;
let tipShownOnce = false;
let staggerNext = true;   // l'entree en cascade joue au prochain rendu

/* --- Formatage compact, propre a chaque langue : le francais met une virgule
   decimale, un espace devant l'unite, et ecrit « Md » la ou l'anglais ecrit
   « B ». --- */
function compact(n) {
  const fr = lang === 'fr';
  const num = (v, d) => (fr ? v.toFixed(d).replace('.', ',') : v.toFixed(d));
  const unit = u => (fr ? ' ' : '') + u;
  if (n >= 1e9) return { v: num(n / 1e9, 2), u: unit(fr ? 'Md' : 'B') };
  if (n >= 1e6) return { v: num(n / 1e6, 2), u: unit('M') };
  if (n >= 1e3) return { v: num(n / 1e3, 1), u: unit('k') };
  return { v: String(n), u: '' };
}
const fmt = n => { const c = compact(n); return c.v + c.u; };

/* Une seule unité : l'API ollama.com publie des nombres d'appels, jamais de
   tokens. Seul le mot change de langue, jamais l'unité. */

/* Seuils de gravité du quota : la barre change de couleur avant le plafond,
   jamais l'inverse — un rouge atteint trop tôt ne veut plus rien dire. */
function severity(ratio) {
  if (ratio >= 0.9) return 'var(--critical)';
  if (ratio >= 0.7) return 'var(--serious)';
  return 'var(--accent)';
}
const exact = n => new Intl.NumberFormat(locale()).format(n);
const pct = x => (lang === 'fr'
  ? (x * 100).toFixed(1).replace('.', ',') + ' %'
  : (x * 100).toFixed(1) + '%');
const usd = n => (lang === 'fr'
  ? n.toFixed(2).replace('.', ',') + ' $'
  : '$' + n.toFixed(2));

/* Nombre de jours du calendrier entre deux instants, en heure locale : c'est
   ce que « demain » veut dire pour qui lit la page. */
const DAY_MS = 86400000;
const joursEntre = (instant, maintenant) =>
  Math.round((new Date(instant).setHours(0, 0, 0, 0)
              - new Date(maintenant).setHours(0, 0, 0, 0)) / DAY_MS);


function whenText(days) {
  if (days === null || days === undefined) return '';
  // Une duree projetee se lit elle aussi en jours du calendrier : « dans
  // 0,9 jour » a 18 h, c'est demain.
  const n = joursEntre(Date.now() + days * DAY_MS, Date.now());
  if (n <= 0) return T('today');
  if (n === 1) return T('tomorrow');
  return fill(T('in {n} days'), { n });
}


/* =====================================================================
   Quota mensuel. Lu sur ollama.com/api/usage — une route non documentee,
   qui renvoie une *part* du plafond et non une somme : le montant affiche
   ici est cette part appliquee au plafond du plan.

   Sans cle, aucun chiffre n'est publie. L'app affichait auparavant un
   montant colle a la main, presente comme le quota du jour alors qu'il
   pouvait dater de plusieurs semaines.
   ===================================================================== */
function renderQuota(q) {
  q = q || {};
  const live = q.source === 'api';
  const keySet = !!q.key_set;
  const keyError = q.key_error || null;
  const monthly = q.monthly || 0;          // le plafond en vigueur
  const monthlySet = q.monthly_set || 0;   // ce qui est saisi, zero si rien
  const has = q.current !== null && q.current !== undefined;
  /* La part vient de l'API, jamais d'un rapport recalcule : c'est elle qui
     porte le pourcentage, meme si le plafond n'est pas renseigne. */
  const ratio = live && typeof q.ratio === 'number' ? q.ratio : 0;
  /* En jours du calendrier, pas en tranches de 24 h : une remise a zero
     demain a 11 h est « demain », pas « aujourd'hui » parce qu'il reste
     23 heures. La date vient du serveur ; `days_left` ne sert plus qu'a
     savoir s'il y en a une. */
  const resetDays = q.days_left === null || q.days_left === undefined ? null
    : joursEntre(q.resets_at, Date.now());
  const resetText = resetDays === null ? ''
    : resetDays <= 0 ? T('reset today')
    : resetDays === 1 ? T('reset tomorrow')
    : fill(T('reset in {n} days'), { n: resetDays });

  /* D'ou vient la date de remise a zero. Une date sans origine est justement
     ce qui trompait : l'app la deduisait d'une fenetre glissante, et le
     quantieme se decalait d'une semaine chaque semaine. Elle se tait
     desormais quand elle ne sait pas. */
  const resetNote = q.resets_source === 'observed' && q.cycle_start
    ? fill(T('Cycle opened on <b>{date}</b> — the app measured that reset itself: ollama.com does not publish the date.'),
           { date: new Date(q.cycle_start).toLocaleDateString(locale()) })
    : q.resets_source === 'settings'
      ? T('Reset date: the one set in Settings. ollama.com does not publish it.')
      : T('Reset date unknown — ollama.com does not publish it. The app will record it the first time it sees one.');

  /* Les projections vivent ici, avec le rythme dont elles decoulent. Le pied
     de la jauge, lui, porte ce qui est constate : la consommation et le temps
     restant. Un compte a rebours masque par une projection, c'est un compte a
     rebours qu'on ne voit jamais. */
  let rateLine = '';
  if (has && q.rate_per_day) {
    const bits = [fill(T('At this rate: <b>+{amount} / day</b>'), { amount: usd(q.rate_per_day) })];
    if (q.projected_at_reset) {
      bits.push(fill(T('projected at reset: {amount}'), { amount: usd(q.projected_at_reset) }));
    }
    if (q.exhausted_in_days !== null && q.exhausted_in_days !== undefined) {
      const beforeReset = q.days_left !== null && q.exhausted_in_days < q.days_left;
      const when = whenText(q.exhausted_in_days);
      bits.push(beforeReset
        ? `<span class="alert">${fill(T('cap reached {when}, before the reset'), { when })}</span>`
        : fill(T('cap reached {when}'), { when }));
    }
    rateLine = `<p class="quota-rate">${bits.join(' · ')}</p>`;
  }

  /* Le motif exact compte : « key rejected » (401), panne reseau et reponse
     inattendue n'appellent pas la meme action de la part de l'utilisateur. */
  const KEY_LINK = '<a href="https://ollama.com/settings/keys" target="_blank" rel="noreferrer">ollama.com/settings/keys</a>';
  const lead = !keySet
    ? T(`Connect your account to read the quota live: the exact percentage, and the
       breakdown by model for <b>all</b> your tools, including those whose
       requests the app never sees.`)
    : keyError === 'key rejected'
      ? fill(T(`<b class="bad">Key rejected</b> — Ollama turned it down. Create another one at
         {link}.`), { link: KEY_LINK })
      : keyError
        ? fill(T(`<b class="bad">Cannot read</b> ({error}) — ollama.com did not
           answer as expected. Another attempt on the next refresh.`), { error: keyError })
        : T(`<b class="bad">Unexpected response</b> from ollama.com. Usage could not
           be read.`);

  /* --- Carte de connexion : le seul endroit où l'app demande une clé.
         Le champ reste vide même quand une clé est enregistrée : le secret
         ne repart jamais vers le navigateur. --- */
  const connect = `
    <div class="connect">
      <p class="connect-lead">${lead}</p>
      <div class="connect-row">
        <label class="visually-hidden" for="api-key">${T('ollama.com API key')}</label>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false"
               placeholder="${keySet ? T('paste another key') : T('paste your API key')}"
               aria-describedby="key-hint">
        <button class="btn primary" id="save-key" type="button">${T('Save')}</button>
      </div>
      <p class="hint" id="key-hint">
        ${fill(T('Create one at {link}. It never leaves your machine and serves only to <em>read</em> your usage.'), { link: KEY_LINK })}
      </p>
    </div>`;

  /* Les parametres vivent dans un depliant commun aux deux etats. La ligne de
     la cle n'apparait qu'en direct : sans cle, c'est la carte de connexion qui
     porte le champ — deux elements de meme identifiant se voleraient la mise
     au point. */
  const settings = `
    <details class="quota-settings">
      <summary>${T('Settings')}</summary>
      <div class="settings-row">
        <label>${T('Language')}
          <select id="lang-select" aria-label="${T('Language')}">
            <option value="auto"${langPref === 'auto' ? ' selected' : ''}>${T('Automatic')}</option>
            <option value="en"${langPref === 'en' ? ' selected' : ''}>English</option>
            <option value="fr"${langPref === 'fr' ? ' selected' : ''}>Français</option>
          </select>
        </label>
      </div>
      <div class="settings-row">
        <label>${T('Monthly cap')}
          <input id="monthly" type="number" min="1" step="1" inputmode="decimal"
                 value="${monthlySet > 0 ? monthlySet : ''}"
                 placeholder="${monthly > 0 ? monthly : ''}">
        </label>
        <label>${T('Next reset')}
          <input id="reset-at" type="date"
                 value="${q.resets_set ? new Date(q.resets_set).toISOString().slice(0, 10) : ''}">
        </label>
        <button class="btn" id="save-monthly" type="button">${T('Save')}</button>
      </div>
      <p class="hint" id="cap-hint">
        ${T('Monthly cap — leave empty to follow your Ollama plan.')}<br>
        ${T('Next reset — leave empty, and the app dates it from the first reset it observes.')}
      </p>
      ${live ? `<div class="settings-row">
        <label>${T('ollama.com API key')}
          <input id="api-key" type="password" autocomplete="off" spellcheck="false"
                 placeholder="${T('paste another key')}" aria-describedby="key-hint-2">
        </label>
        <button class="btn" id="save-key" type="button">${T('Change')}</button>
        <button class="btn" id="remove-key" type="button">${T('Remove')}</button>
      </div>
      <p class="hint" id="key-hint-2">
        ${T('Replacing the key revokes the old one on the next read. Removing it leaves only the sign-in card: the whole quota comes from ollama.com, so with no key there is no figure left.')}
      </p>` : ''}
    </details>`;

  /* Sans cle, la section se reduit a la carte de connexion : le quota est une
     donnee d'ollama.com, et sans cle il n'y en a aucune — ni pourcentage, ni
     jauge, ni montant. La date de reinitialisation reste reglable dans les
     reglages : c'est de la, ou d'une remise a zero deja vue, qu'elle vient. */
  if (!live) {
    return `
      <section class="quota" aria-labelledby="quota-h">
        <h2 id="quota-h" class="visually-hidden">${T('Monthly quota')}</h2>
        ${connect}
        ${settings}
      </section>`;
  }

  const meterLabel = T('{pct} of the monthly quota consumed').replace('{pct}', pct(ratio))
    + (has ? fill(T(' — {current} of {monthly}'), { current: usd(q.current), monthly: usd(monthly) }) : '');

  return `
    <section class="quota" aria-labelledby="quota-h">
      <h2 id="quota-h" class="visually-hidden">${T('Monthly quota')}</h2>
      <div class="quota-head">
        <span class="t">${T('Monthly quota')}</span>
        <span class="pct">${pct(ratio)}</span>
      </div>
      <div class="meter" role="img" style="--fill:${severity(ratio)}"
           aria-label="${meterLabel}">
        <span style="transform:scaleX(${Math.min(ratio, 1).toFixed(4)})"></span>
      </div>
      <div class="quota-foot">
        <span>${has ? fill(T('{current} of {monthly}'), { current: usd(q.current), monthly: usd(monthly) }) : T('no cap set')}</span>
        <span>${resetText}</span>
      </div>
      ${rateLine}
      <p class="quota-source">
        ${resetNote} ${T("<b>ollama.com</b> publishes the consumed percentage; the amount in dollars is that percentage applied to the plan's cap. It therefore lands on the sum shown on the site.")}
      </p>
      ${settings}
    </section>`;
}

/* =====================================================================
   Rendu principal
   ===================================================================== */

/* Le regroupement au-dela du huitieme modele est decide par le serveur, mais
   son libelle appartient au client : le serveur ne sait pas dans quelle langue
   la page s'affiche. Il envoie donc de quoi le composer. */
const modelLabel = m => (m.other ? fill(T('Other ({n})'), { n: m.other_count ?? '?' }) : m.model);

function render(data) {
  const app = document.getElementById('app');
  const models = data.models;
  const total = data.grand_total;

  const sub = document.getElementById('sub');

  app.classList.remove('switching');

  /* Sans cle, il n'y a aucune source : la section quota porte alors la carte
     de connexion, et rien d'autre ne s'affiche. C'est le seul etat ou l'app
     n'a rien a dire. On teste la source, pas l'unite : un payload vide publie
     deja son unite. */
  if (data.quota?.source !== 'api') {
    sub.textContent = '';
    sub.hidden = true;
    app.innerHTML = renderQuota(data.quota);
    return;
  }
  sub.hidden = false;

  const quota = renderQuota(data.quota);

  if (!models.length) {
    sub.textContent = T('Ollama Cloud usage');
    app.innerHTML = `
      <p class="state">${T('No usage in this cycle.')}</p>
      ${quota}`;
    return;
  }

  /* Titre auto-informatif : le chiffre ET sa lecture, sans avoir a lire plus bas. */
  const top = models[0];
  let reading = fill(T('<b>{total}</b> requests this month'), { total: fmt(total) });
  if (models.length > 1) {
    reading += fill(T(', led by <b>{model}</b> at {pct}'), { model: modelLabel(top), pct: pct(top.share) });
  } else {
    reading += fill(T(', all on <b>{model}</b>'), { model: modelLabel(top) });
  }
  reading += '.';
  sub.innerHTML = reading;

  /* La fenetre utile est le cycle d'abonnement, pas le mois civil : sinon
     « moyenne / jour » diviserait un cumul de plusieurs semaines par un jour.
     Quand le debut du cycle n'est pas connu, il n'y a pas de moyenne — plutot
     qu'un chiffre divise par rien. Arrondi, parce que sous 1000 compact()
     afficherait la valeur brute, decimales comprises. */
  const avg = data.cycle_days ? Math.round(total / data.cycle_days) : null;

  /* Repartition par modele */
  const rows = models.map(m => {
    const v = SLOTS[m.slot] || SLOTS[8];
    return `
      <div class="model" data-model="${m.model}">
        <i class="swatch" style="background:var(${v})"></i>
        <div class="model-name">
          <span class="id">${modelLabel(m)}</span>
          <span class="n">${exact(m.messages)} ${T(m.messages > 1 ? 'requests' : 'request')}</span>
        </div>
        <div class="bar" role="img" aria-label="${fill(T('{model}: {pct} of the total'), { model: modelLabel(m), pct: pct(m.share) })}">
          <span style="--c:var(${v}); transform:scaleX(${m.share.toFixed(4)})"></span>
        </div>
        <div class="model-stats">
          <span class="tok">${fmt(m.total)}</span><span class="pct">${pct(m.share)}</span>
        </div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <h2 class="visually-hidden">${T('Overview')}</h2>

    <div class="hero-row">
      <div class="hero-figure">
        <div class="hero-label">${T('Requests this month')}</div>
        <div class="hero-value" id="hero">${compact(total).v}${compact(total).u ? `<span class="hero-unit">${compact(total).u}</span>` : ''}</div>
      </div>
      <div class="stat">
        <span class="k">${T('Active models')}</span>
        <span class="v">${data.models_total ?? models.length}</span>
      </div>
      <div class="stat">
        <span class="k">${T('Average / day')}</span>
        <span class="v">${avg === null ? '—' : fmt(avg)}</span>
      </div>
    </div>

    <div class="split">
      <div class="stack">
        ${quota}
      </div>
      <section aria-labelledby="split-h">
        <h2 id="split-h" class="section-title">${T('Breakdown by model')}</h2>
        <div class="models${staggerNext ? ' stagger' : ''}">${rows}</div>
      </section>
    </div>

    ${data.error ? `<div class="warn-line" role="alert">${fill(T('Read error: {error}'), { error: data.error })}</div>` : ''}
  `;

  document.getElementById('hero').setAttribute('aria-label',
    fill(T('{n} requests this month'), { n: exact(total) }));

  /* L'entree en cascade ne joue qu'une fois par periode : on retire la classe
     au frame suivant pour que la transition se declenche, et les mises a jour
     temps reel ne la rejouent pas. */
  if (staggerNext) {
    const list = app.querySelector('.models');
    if (list) {
      requestAnimationFrame(() => requestAnimationFrame(() => list.classList.remove('stagger')));
    }
    staggerNext = false;
  }
}

/* =====================================================================
   Theme : auto (suit macOS), clair ou sombre.
   ===================================================================== */
const THEMES = ['auto', 'light', 'dark'];
const THEME_ICONS = { auto: '◐', light: '☀', dark: '☾' };
const THEME_LABELS = { auto: 'Theme: automatic', light: 'Theme: light', dark: 'Theme: dark' };
let theme = 'auto';

/* Le theme et la langue vivent dans la meme section : meme mecanisme — un
   reglage stocke par le serveur, un bouton qui fait le tour des valeurs, et
   "auto" qui suit la machine. */
const LANGS = ['auto', 'en', 'fr'];
const LANG_LABELS = { auto: 'Language: automatic', en: 'Language: English', fr: 'Language: French' };

function applyTheme(value) {
  theme = THEMES.includes(value) ? value : 'auto';
  const root = document.documentElement;
  if (theme === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', theme);

  const icon = document.getElementById('theme-icon');
  const button = document.getElementById('theme');
  if (icon) icon.textContent = THEME_ICONS[theme];
  if (button) button.title = T(THEME_LABELS[theme]);
}

/* Applique la langue et repeint ce qui ne depend pas du rendu : le titre de
   l'onglet, le lien d'evitement, les infobulles. Le corps est redessine par
   render() — la signature du flux porte `lang`, donc un changement force un
   rendu complet sans qu'on ait a le demander ici. */
function applyLang(value) {
  langPref = LANGS.includes(value) ? value : 'auto';
  lang = resolveLang(langPref);

  document.documentElement.lang = lang;
  document.title = T('Ollama Buddy — Ollama Cloud model usage');

  // Le texte d'attente, tant que le premier envoi du serveur n'est pas arrive.
  // Il disparait avec #app des le premier rendu : la recherche renvoie alors
  // null et il n'y a plus rien a traduire.
  const boot = document.getElementById('boot');
  if (boot) boot.textContent = T('Reading…');

  const skip = document.querySelector('.skip');
  if (skip) skip.textContent = T('Skip to content');
  const sub = document.getElementById('sub');
  if (sub && !sub.hidden) sub.textContent = T('Ollama Cloud usage');
  const refresh = document.getElementById('refresh');
  if (refresh) {
    refresh.setAttribute('aria-label', T('Refresh usage'));
    refresh.title = T('Ask ollama.com for usage again without waiting for the cache to expire');
  }
  const themeBtn = document.getElementById('theme');
  if (themeBtn) themeBtn.setAttribute('aria-label', T('Change theme'));
  const langBtn = document.getElementById('lang');
  if (langBtn) langBtn.setAttribute('aria-label', T('Change language'));
  // L'icone montre la langue LUE, l'infobulle dit ce qui est REGLE : savoir ce
  // qu'on lit est plus utile que savoir d'ou ca vient.
  const langIcon = document.getElementById('lang-icon');
  if (langIcon) langIcon.textContent = lang === 'fr' ? 'FR' : 'EN';
  if (langBtn) langBtn.title = T(LANG_LABELS[langPref]);

  applyTheme(theme);   // l'infobulle du theme est elle aussi traduite
  setLive(liveState);  // « En direct » / « Live » suit la langue
}

/* Un reglage change : on l'applique tout de suite, on force le rendu sans
   attendre le prochain battement du flux, et on le dit au serveur. L'echec
   reseau n'est pas fatal — le reglage vaut deja pour cette vue. */
function changeLang(value) {
  applyLang(value);
  lastSignature = '';
  if (lastData) applyData(lastData);
  fetch('/api/lang', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lang: value }),
  }).catch(() => { /* deja applique localement */ });
}

document.getElementById('theme').addEventListener('click', async () => {
  const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  applyTheme(next);
  try {
    await fetch('/api/theme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme: next }),
    });
  } catch { /* le reglage est deja applique localement */ }
});

document.getElementById('lang').addEventListener('click', () => {
  changeLang(LANGS[(LANGS.indexOf(langPref) + 1) % LANGS.length]);
});

/* =====================================================================
   Chargement : flux pousse par le serveur (SSE), avec repli sur un fetch
   si les flux ne sont pas disponibles.
   ===================================================================== */
let stream = null;
let lastSignature = '';

function applyData(data) {
  /* Rien de neuf ? On ne redessine pas : sinon les animations d'entree
     rejoueraient a chaque battement du flux. */
  const signature = [
    data.grand_total, data.messages, data.error, data.cycle_days,
    data.models?.length, data.models_total,
    data.models?.map(m => `${m.model}:${m.total}`).join(','),
    data.quota?.current, data.quota?.monthly, data.quota?.rate_per_day,
    data.quota?.resets_at, data.theme, data.lang,
    /* source / key_set / key_error sont indispensables a la signature :
       passer d'une cle refusee a une cle retiree ne change aucune autre
       composante, donc rien ne se redessinerait. */
    data.quota?.source, data.quota?.key_set, data.quota?.key_error,
  ].join('|');
  if (signature === lastSignature) return;
  lastSignature = signature;

  lastData = data;
  if (data.theme) applyTheme(data.theme);
  if (data.lang) applyLang(data.lang);

  const planEl = document.getElementById('plan');
  if (data.account?.plan) {
    planEl.textContent = 'Ollama ' + data.account.plan;
    planEl.hidden = false;
  }

  if (data.error && !data.models) {
    document.getElementById('app').innerHTML =
      `<p class="state" role="alert">${fill(T('Error: {error}'), { error: data.error })}</p>`;
    return;
  }
  render(data);
}

let liveState = 'connecting';

function setLive(state) {
  liveState = state;   // retenu : applyLang redessine ce libelle
  const el = document.getElementById('live');
  el.hidden = false;
  el.classList.toggle('stale', state !== 'on');
  el.lastElementChild.textContent =
    T(state === 'on' ? 'Live' : state === 'off' ? 'Reconnecting…' : 'Connecting…');
}

function beat() {
  const el = document.getElementById('live');
  el.classList.remove('pulse');
  void el.offsetWidth;          // force le redemarrage de l'animation
  el.classList.add('pulse');
}


function connect() {
  if (stream) { stream.close(); stream = null; }

  if (!('EventSource' in window)) {   // repli : interrogation periodique
    setLive('off');
    load();
    setInterval(load, 5000);
    return;
  }

  setLive('connecting');
  stream = new EventSource('/api/stream');
  stream.onopen = () => setLive('on');
  stream.onmessage = event => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    setLive('on');
    applyData(data);
    beat();
  };
  stream.onerror = () => setLive('off');   // EventSource se reconnecte seul
}

/* Repli sans flux : un simple aller-retour HTTP. */
async function load() {
  try {
    const res = await fetch('/api/usage');
    applyData(await res.json());
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<p class="state" role="alert">${fill(T('Could not read usage: {error}'), { error: err.message })}</p>`;
  }
}

/* --- Quota : les controles sont recrees a chaque rendu, on delegue --- */
async function postQuota(payload, button) {
  if (button) button.disabled = true;
  try {
    const res = await fetch('/api/quota', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.quota && lastData) {
      lastData = { ...lastData, quota: data.quota };
      lastSignature = '';
      if (lastData.models) render(lastData);
    }
  } catch { /* le flux resynchronisera */ }
  finally { if (button) button.disabled = false; }
}

document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;


  if (btn.id === 'save-monthly') {
    const raw = document.getElementById('monthly').value.trim();
    // Vide veut dire « suis l'offre » : c'est la valeur par defaut, et le seul
    // chemin de retour une fois un plafond saisi.
    const value = raw === '' ? 0 : parseFloat(raw);
    if (!Number.isFinite(value) || value < 0) return;
    postQuota({ monthly_quota: value }, btn);
  }

  if (btn.id === 'refresh') {
    /* Le serveur purge son cache et redemande l'usage a ollama.com : sans ca,
       la part du quota resterait figee une minute de plus. */
    btn.setAttribute('aria-busy', 'true');
    fetch('/api/refresh', { method: 'POST' })
      .catch(() => { /* le flux reprendra de toute facon */ })
      .finally(() => {
        btn.removeAttribute('aria-busy');
        reload();
      });
  }

  if (btn.id === 'save-key') {
    const field = document.getElementById('api-key');
    const key = field.value.trim();
    if (!key) { field.focus(); return; }
    // Le champ est vide des l'envoi : le secret ne reste pas dans le DOM.
    field.value = '';
    postQuota({ ollama_api_key: key }).then(reload);
  }

  if (btn.id === 'remove-key') {
    postQuota({ ollama_api_key: '' }).then(reload);
  }
});

/* Changer de cle change ce qu'ollama.com accepte de repondre — ou refuse de
   repondre. Le flux doit repartir de zero, sinon la vue reste sur l'ancien
   etat jusqu'au prochain push, qui peut tarder. */
function reload() {
  lastSignature = '';
  connect();
}

/* Entree dans un champ de quota : on valide sans quitter le champ. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'monthly') document.getElementById('save-monthly')?.click();
  if (id === 'api-key') document.getElementById('save-key')?.click();
});

document.addEventListener('change', e => {
  if (e.target.id !== 'reset-at' || !e.target.value) return;
  const when = new Date(e.target.value + 'T00:00:00');
  if (Number.isNaN(when.getTime())) return;
  postQuota({ quota_reset_at: when.getTime() });
});

/* Le select des reglages : il double le bouton de l'en-tete. Meme chemin. */
document.addEventListener('change', e => {
  if (e.target.id !== 'lang-select') return;
  changeLang(e.target.value);
});


/* Revenir sur l'onglet ne doit pas laisser une vue figee. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!stream || stream.readyState === EventSource.CLOSED)) {
    lastSignature = '';
    connect();
  }
});

if (reduceMotion.matches) tipShownOnce = true;
/* Peinture immediate : navigator.language est disponible tout de suite, donc
   un Mac en francais ne voit pas passer une interface anglaise. Le reglage du
   serveur, s'il est explicite, corrige au premier envoi. */
applyLang('auto');
connect();
</script>
</body>
</html>
